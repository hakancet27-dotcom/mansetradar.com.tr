<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puan Durumu | Manşet Radar</title>
  <meta name="description" content="Süper Lig ve popüler liglerin güncel puan durumu.">
  <link rel="canonical" href="https://mansetradar.com.tr/puan-durumu/">
  <style>
    :root{--red:#e10600;--dark:#171727;--page:#f4f6f8;--line:#e5e7eb;--muted:#667085;--text:#24292f}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font-family:Segoe UI,Arial,sans-serif;line-height:1.45}.wrap{max-width:960px;margin:0 auto;padding:18px}header{background:#fff;border-bottom:3px solid var(--red);box-shadow:0 2px 10px rgba(15,23,42,.07)}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--dark);font-weight:900}.mark{width:38px;height:38px;border-radius:8px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}.home{color:var(--red);font-weight:800;text-decoration:none}.hero{background:#080b12;color:#fff;border-radius:18px;padding:22px;margin:20px 0;box-shadow:0 16px 36px rgba(15,23,42,.16)}.kicker{color:#ffb4ae;font-size:.76rem;font-weight:900;letter-spacing:.7px;text-transform:uppercase}.hero h1{margin:5px 0 6px;font-size:clamp(1.8rem,5vw,3rem);line-height:1.05}.hero p{margin:0;color:rgba(255,255,255,.78)}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(15,23,42,.07)}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}.chip{border:1px solid var(--line);background:#f8fafc;color:#111827;border-radius:999px;padding:9px 12px;font-weight:900;white-space:nowrap;cursor:pointer}.chip.active{background:var(--red);border-color:var(--red);color:#fff}.meta{color:var(--muted);font-size:.82rem;font-weight:700;margin-bottom:12px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;background:#fff;min-width:650px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:.88rem}th{background:#f1f5f9;color:#334155;font-weight:900}td.team{text-align:left;font-weight:900;color:#111827}td.points{color:var(--red);font-weight:900}.empty{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:14px;font-weight:800}.status{margin-top:10px;color:var(--muted);font-size:.8rem}.back{display:inline-flex;margin-top:16px;color:var(--red);font-weight:900;text-decoration:none}@media(max-width:640px){.wrap{padding:12px}.panel{padding:10px}th,td{padding:9px 8px;font-size:.82rem}}
  </style>
</head>
<body>
  <header><div class="wrap"><a class="logo" href="/"><span class="mark">M</span><span>Manşet Radar</span></a><a class="home" href="/">Ana sayfa</a></div></header>
  <main class="wrap">
    <section class="hero"><div class="kicker">Canlı Spor</div><h1>Puan Durumu</h1><p>Süper Lig ve popüler liglerin güncel sıralaması.</p></section>
    <section class="panel">
      <div id="leagueChips" class="chips" aria-label="Lig seçimi"></div>
      <div id="meta" class="meta">Veri yükleniyor...</div>
      <div id="content" class="empty">Puan durumu yükleniyor...</div>
      <a class="back" href="/">← Ana sayfaya dön</a>
    </section>
  </main>
  <script>
    const chips = document.getElementById('leagueChips');
    const meta = document.getElementById('meta');
    const content = document.getElementById('content');
    let payload = null;
    let selected = null;
    function escapeHtml(value){return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function render(){
      const leagues = payload?.leagues || [];
      const league = leagues.find(item => item.id === selected) || leagues[0];
      if(!league){meta.textContent='Veri bulunamadı';content.className='empty';content.textContent='Puan durumu verisi şu an alınamadı.';return;}
      chips.innerHTML = leagues.map(item => `<button class="chip ${item.id===league.id?'active':''}" data-id="${escapeHtml(item.id)}">${escapeHtml(item.name)}</button>`).join('');
      meta.textContent = `${league.source || payload.source || 'Kaynak'} · ${new Date(league.updatedAt || payload.updatedAt).toLocaleString('tr-TR')}`;
      const rows = Array.isArray(league.table) ? league.table : [];
      if(!rows.length){content.className='empty';content.textContent='Bu lig için puan durumu verisi şu an alınamadı. Lütfen daha sonra tekrar kontrol edin.';return;}
      content.className='table-wrap';
      content.innerHTML = `<table><thead><tr><th>#</th><th style="text-align:left">Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>Av</th><th>P</th></tr></thead><tbody>${rows.map(row => `<tr><td>${escapeHtml(row.position)}</td><td class="team">${escapeHtml(row.team)}</td><td>${escapeHtml(row.played)}</td><td>${escapeHtml(row.won)}</td><td>${escapeHtml(row.draw)}</td><td>${escapeHtml(row.lost)}</td><td>${escapeHtml(row.goalDifference)}</td><td class="points">${escapeHtml(row.points)}</td></tr>`).join('')}</tbody></table>${league.status ? `<div class="status">Not: ${escapeHtml(league.status)}</div>` : ''}`;
      chips.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => { selected = btn.dataset.id; render(); }));
    }
    fetch('/data/standings.json', {cache:'no-store'}).then(r => r.json()).then(data => { payload=data; selected=data.defaultLeagueId; render(); }).catch(() => { meta.textContent='Veri alınamadı'; content.className='empty'; content.textContent='Puan durumu verisi şu an yüklenemedi.'; });
  </script>
</body>
</html>
