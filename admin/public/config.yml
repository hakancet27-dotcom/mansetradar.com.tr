# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: hakancet27-dotcom/mansetradar.com.tr
  branch: main
  auth_methods: [token]

media_folder: articles/images
public_folder: /articles/images
publish_mode: simple
site_url: https://mansetradar.com.tr
display_url: https://mansetradar.com.tr
locale: tr

collections:
  - name: stock_image_pool
    label: "0 - Stok Gorsel Havuzu"
    label_singular: "Stok Gorsel"
    folder: cms-stock-images
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{category}} | {{title}}"
    media_folder: articles/images/stock
    public_folder: /articles/images/stock
    fields:
      - { label: Baslik, name: title, widget: string, hint: "Havuzda bu gorseli kolay bulmak icin kisa bir ad ver." }
      - { label: Kategori, name: category, widget: select, default: Gundem, options: [Son Dakika, Gundem, Siyaset, Ekonomi, Dunya, Spor, Magazin, Teknoloji, Saglik, Video, Genel] }
      - { label: Gorsel Yukle, name: image_url, widget: image, required: true, hint: "Buradan dosya sec; gorsel dogrudan stok havuzuna atilir." }
      - { label: Gorsel Alt Metni, name: image_alt, widget: string, required: false, hint: "Gorseli kisaca anlat. Sonra haberlerde kullanmak daha kolay olur." }
      - { label: Saglayici, name: provider, widget: string, required: false }
      - { label: Lisans, name: license, widget: string, required: false }
      - { label: Kaynak Sayfasi, name: source_url, widget: string, required: false }
      - { label: Etiketler, name: tags, widget: list, required: false, field: { label: Etiket, widget: string } }
      - { label: Not, name: note, widget: text, required: false, hint: "Ornek: spor genel kullanima uygun, insan kalabaligi yok." }

  - name: published_tr
    label: "Yayindaki Haberler / Turkce"
    label_singular: "Yayindaki Turkce Haber"
    folder: data/cms-published/articles
    create: false
    delete: true
    extension: json
    format: json
    identifier_field: slug
    summary: "{{date}} {{time}} | {{category}} | {{title}}"
    fields: &published_fields
      - { label: Baslik, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, readonly: true }
      - { label: Tarih, name: date, widget: string, required: false }
      - { label: Saat, name: time, widget: string, required: false }
      - { label: Dil, name: language, widget: string, required: false, readonly: true }
      - { label: Ulke, name: country, widget: string, required: false, readonly: true }
      - { label: Kategori, name: category, widget: string, required: false }
      - { label: Spot, name: spot, widget: text, required: false }
      - { label: Ozet, name: summary, widget: text, required: false }
      - { label: Haber Govdesi HTML, name: content_html, widget: text, required: false }
      - label: Stok Havuzundan Sec
        name: stock_image_pick
        widget: relation
        required: false
        collection: stock_image_pool
        search_fields: [title, category, image_alt, provider, note]
        display_fields: [category, title, image_alt]
        value_field: image_url
        hint: "Havuzdaki gorsellerden birini sec; secim alttaki gorsel alanina otomatik yazilir."
      - { label: Gorsel URL / Yukleme Yolu, name: image_url, widget: image, required: false, hint: "Gorselsiz bir habere en kolay buradan dosya yukleyebilirsin. Mevcut path de burada tutulur." }
      - { label: Gorsel Alt Metni, name: image_alt, widget: string, required: false, hint: "Gorseli kisa, acik ve insani bir dille tarif et." }
      - label: Ek Gorseller
        name: image_gallery
        widget: list
        required: false
        fields:
          - { label: Gorsel, name: image_url, widget: image, required: true }
          - { label: Alt Metin, name: image_alt, widget: string, required: false }
          - { label: Aciklama, name: caption, widget: string, required: false }
      - { label: Meta Title, name: meta_title, widget: string, required: false }
      - { label: Meta Description, name: meta_description, widget: text, required: false }
      - { label: Etiketler, name: tags, widget: list, required: false, field: { label: Etiket, widget: string } }
      - { label: Indexed On Home, name: indexed_on_home, widget: boolean, required: false, readonly: true }
      - { label: Kaynak JSON, name: source_json_path, widget: string, required: false, readonly: true }
      - { label: Canli URL, name: public_url, widget: string, required: false, readonly: true }
      - { label: Yayin Asamasi, name: publication_lifecycle, widget: string, required: false, readonly: true, hint: "Bu listeden Delete yaparsan kaynak haber arsive tasinir; sonraki workflowda geri uretilmez. Tek run'da en fazla 5 silme islenir." }
      - { label: Yayin Notu, name: publication_note, widget: text, required: false, readonly: true }

  - name: published_en
    label: "Published News / English"
    label_singular: "Published English News"
    folder: data/cms-published/news/articles
    create: false
    delete: true
    extension: json
    format: json
    identifier_field: slug
    summary: "{{date}} {{time}} | {{category}} | {{title}}"
    fields: *published_fields

  - name: published_de
    label: "Veroeffentlichte Nachrichten / Deutsch"
    label_singular: "Veroeffentlichte Nachricht"
    folder: data/cms-published/nachrichten/artikel
    create: false
    delete: true
    extension: json
    format: json
    identifier_field: slug
    summary: "{{date}} {{time}} | {{category}} | {{title}}"
    fields: *published_fields
