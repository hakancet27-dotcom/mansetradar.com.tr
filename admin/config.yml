# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: hakancet27-dotcom/mansetradar.com.tr
  branch: main
  auth_methods: [token]

media_folder: articles/images
public_folder: /articles/images
publish_mode: simple
site_url: https://mansetradar.com.tr
display_url: https://mansetradar.com.tr
locale: tr

collections:
  - name: published_tr
    label: "Yayindaki Haberler / Turkce"
    label_singular: "Yayindaki Turkce Haber"
    folder: data/cms-published/articles
    create: false
    delete: true
    extension: json
    format: json
    identifier_field: slug
    summary: "{{date}} | {{category}} | {{title}}"
    fields: &published_fields
      - { label: Baslik, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, readonly: true }
      - { label: Tarih, name: date, widget: datetime, format: "DD.MM.YYYY", date_format: "DD.MM.YYYY", time_format: false, picker_utc: false }
      - { label: Dil, name: language, widget: string, required: false, readonly: true }
      - { label: Ulke, name: country, widget: string, required: false, readonly: true }
      - { label: Kategori, name: category, widget: string, required: false }
      - { label: Spot, name: spot, widget: text, required: false }
      - { label: Ozet, name: summary, widget: text, required: false }
      - { label: Haber Govdesi HTML, name: content_html, widget: text, required: false }
      - { label: Ana Gorsel, name: image_url, widget: image, required: false }
      - { label: Gorsel Alt Metni, name: image_alt, widget: string, required: false }
      - label: Ek Gorseller
        name: image_gallery
        widget: list
        required: false
        fields:
          - { label: Gorsel, name: image_url, widget: image, required: true }
          - { label: Alt Metin, name: image_alt, widget: string, required: false }
          - { label: Aciklama, name: caption, widget: string, required: false }
      - { label: Meta Title, name: meta_title, widget: string, required: false }
      - { label: Meta Description, name: meta_description, widget: text, required: false }
      - { label: Discover Basliklari, name: discover_titles, widget: list, required: false, field: { label: Baslik, widget: string } }
      - { label: Etiketler, name: tags, widget: list, required: false, field: { label: Etiket, widget: string } }
      - { label: Quality Score, name: quality_score, widget: number, required: false, readonly: true }
      - { label: Quality Status, name: quality_status, widget: string, required: false, readonly: true }
      - { label: Risk Bayragi, name: flag, widget: string, required: false, readonly: true }
      - { label: Quality Flags, name: quality_flags, widget: list, required: false, readonly: true, field: { label: Flag, widget: string } }
      - { label: Indexed On Home, name: indexed_on_home, widget: boolean, required: false, readonly: true }
      - { label: Kaynak JSON, name: source_json_path, widget: string, required: false, readonly: true }
      - { label: Canli URL, name: public_url, widget: string, required: false, readonly: true }
      - { label: Yayin Asamasi, name: publication_lifecycle, widget: string, required: false, readonly: true }

  - name: published_en
    label: "Published News / English"
    label_singular: "Published English News"
    folder: data/cms-published/news/articles
    create: false
    delete: true
    extension: json
    format: json
    identifier_field: slug
    summary: "{{date}} | {{category}} | {{title}}"
    fields: *published_fields

  - name: published_de
    label: "Veroeffentlichte Nachrichten / Deutsch"
    label_singular: "Veroeffentlichte Nachricht"
    folder: data/cms-published/nachrichten/artikel
    create: false
    delete: true
    extension: json
    format: json
    identifier_field: slug
    summary: "{{date}} | {{category}} | {{title}}"
    fields: *published_fields
