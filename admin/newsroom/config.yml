# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: hakancet27-dotcom/haber-botu
  branch: main

media_folder: newsroom/media/uploads
public_folder: /newsroom/media/uploads
publish_mode: simple
site_url: https://mansetradar.com.tr
locale: tr

# Private editor paneli. Asil editoryal kaynak burasidir.
# Public site paneli yalnizca yayindaki JSON bakimi icindir.
collections:
  - name: newsroom_status
    label: "0 - Sistem Durumu"
    files:
      - name: last_run
        label: "Son Newsroom Calismasi"
        file: newsroom/status/last-run.json
        fields:
          - { label: Islenme Zamani, name: processed_at, widget: string, required: false, readonly: true }
          - { label: Durum, name: status, widget: string, required: false, readonly: true }
          - { label: Mesaj, name: message, widget: text, required: false, readonly: true }
          - label: Sonuclar
            name: results
            widget: object
            required: false
            readonly: true
            fields:
              - { label: Trend, name: trends, widget: number, required: false }
              - { label: Gorsel, name: images, widget: number, required: false }
              - { label: Taslak, name: drafts, widget: number, required: false }
              - { label: AI, name: ai_requests, widget: number, required: false }
              - { label: Yayin, name: published, widget: number, required: false }
      - name: dashboard
        label: "Panel Ozeti"
        file: newsroom/status/dashboard.json
        fields:
          - { label: Uretildi, name: generated_at, widget: string, required: false, readonly: true }
          - { label: Site Degisikligi, name: site_changed, widget: boolean, required: false, readonly: true }
          - label: Kuyruklar
            name: queues
            widget: object
            required: false
            readonly: true
            fields:
              - { label: Taslaklar, name: drafts_total, widget: number, required: false }
              - { label: Inceleme Bekleyen, name: review_pending_total, widget: number, required: false }
              - { label: Inceleme Arsivi, name: review_archive_total, widget: number, required: false }
              - { label: Inceleme Gorselleri, name: review_pending_images_total, widget: number, required: false }
              - { label: AI Talepleri, name: ai_requests_total, widget: number, required: false }
              - { label: Workflow Talepleri, name: workflow_requests_total, widget: number, required: false }
              - { label: Toplu Islemler, name: bulk_requests_total, widget: number, required: false }
              - { label: Gorsel Islemleri, name: image_requests_total, widget: number, required: false }
              - { label: Trend Kayitlari, name: trends_total, widget: number, required: false }
          - label: Aksiyon Gerektirenler
            name: actionable
            widget: object
            required: false
            readonly: true
            fields:
              - { label: Taslak - Incelemeye Gonder, name: drafts_submit_for_review, widget: number, required: false }
              - { label: Taslak - Yayin Hazir, name: drafts_ready_to_publish, widget: number, required: false }
              - { label: Inceleme - Bekleyen, name: review_pending_waiting, widget: number, required: false }
              - { label: Inceleme - Yayin Hazir, name: review_ready_to_publish, widget: number, required: false }
              - { label: AI - Dikkat Gerekiyor, name: ai_needs_attention, widget: number, required: false }
              - { label: Workflow - Onay Bekliyor, name: workflow_approval_required, widget: number, required: false }
              - { label: Workflow - Calismaya Hazir, name: workflow_ready_to_run, widget: number, required: false }
              - { label: Toplu - Onay Bekliyor, name: bulk_approval_required, widget: number, required: false }
              - { label: Toplu - Calismaya Hazir, name: bulk_ready_to_run, widget: number, required: false }
              - { label: Gorsel - Basarisiz, name: image_failed, widget: number, required: false }
              - { label: Trend - Makale Isteyen, name: trend_generate_article, widget: number, required: false }
          - label: Saglik
            name: health
            widget: object
            required: false
            readonly: true
            fields:
              - { label: CMS Kaynak Hata, name: cms_source_errors, widget: number, required: false }
              - { label: CMS Kaynak Uyari, name: cms_source_warnings, widget: number, required: false }
              - { label: Kategori Topic Uyusmazligi, name: category_topic_conflicts, widget: number, required: false }

  - name: newsroom_create_article
    label: "1 - Sifirdan Haber Yaz"
    label_singular: "Haber Taslagi"
    folder: newsroom/drafts
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{workflow_status}} | {{category}} | {{title}}"
    fields:
      - label: Islem
        name: workflow_status
        widget: select
        default: draft
        hint: "Bu alan taslagin bir sonraki adimini belirler."
        options:
          - { label: Taslak, value: draft }
          - { label: AI ile Gelistir, value: ai_enhance_requested }
          - { label: Incelemeye Gonder, value: submit_for_review }
          - { label: Onayla ve Yayinla, value: approved_to_publish }
          - { label: Islendi, value: processed }
          - { label: Dikkat Gerekiyor, value: needs_attention }
      - { label: Kategori, name: category, widget: select, default: Gundem, options: [Son Dakika, Gundem, Siyaset, Ekonomi, Dunya, Spor, Magazin, Teknoloji, Saglik, Video] }
      - { label: One Cikar, name: featured, widget: boolean, default: false, required: false }
      - { label: Baslik, name: title, widget: string }
      - { label: Spot, name: spot, widget: text, required: false, hint: "Haberi bir iki cumlede ozetleyen kisa giris." }
      - { label: Haber Govdesi HTML, name: content_html, widget: text, required: false }
      - { label: Dogrulanmis Ham Bilgi, name: source_note, widget: text, required: false }
      - { label: Kaynak Linkleri, name: source_urls, widget: list, required: false, field: { label: URL, widget: string } }
      - { label: AI Talimati, name: editor_ai_instruction, widget: text, required: false }
      - { label: Gorsel Yukle, name: uploaded_image, widget: image, required: false, hint: "Haberde gorsel yoksa buradan dosya secip ekleyebilirsin." }
      - { label: Gorsel Alt Metni, name: image_alt, widget: string, required: false, hint: "Gorseli bir insan gibi kisa ve net tarif et." }
      - { label: Etiketler, name: tags, widget: list, required: false, field: { label: Etiket, widget: string } }
      - { label: Meta Baslik, name: meta_title, widget: string, required: false }
      - { label: Meta Aciklama, name: meta_description, widget: text, required: false }
      - { label: Sonuc, name: processor_result, widget: text, required: false, readonly: true }

  - name: newsroom_review
    label: "2 - Onay Bekleyen / Inceleme Kuyrugu"
    folder: newsroom/review/pending
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "Durum: {{review_status}} | Skor: {{quality_score}} | Risk: {{quality_status}} | Bayrak: {{flag}} | {{title}}"
    fields: &review_fields
      - label: Durum
        name: review_status
        widget: select
        default: pending
        hint: "Editor karari burada verilir."
        options:
          - { label: Beklemede, value: pending }
          - { label: Onayla ve Yayinla, value: approved_to_publish }
          - { label: Reddedildi, value: rejected }
          - { label: Yayinlandi, value: published }
      - { label: Kategori, name: category, widget: select, options: [Son Dakika, Gundem, Siyaset, Ekonomi, Dunya, Spor, Magazin, Teknoloji, Saglik, Video] }
      - { label: Baslik, name: title, widget: string }
      - { label: Spot, name: spot, widget: text, required: false, hint: "Yayina gidecek kisa giris metni." }
      - { label: Haber Govdesi HTML, name: content_html, widget: text, required: false }
      - { label: Gorsel Yukle, name: uploaded_image, widget: image, required: false, hint: "Haberde gorsel yoksa en kolay yol buradan gorsel yuklemek." }
      - { label: Gorsel URL, name: image_url, widget: string, required: false, hint: "Hazir bir gorsel URL'i varsa kullan; yoksa yukaridaki alan daha pratiktir." }
      - { label: Gorsel Alt Metni, name: image_alt, widget: string, required: false, hint: "Okuyucuya ve Google'a gorselin ne anlattigini kisaca yaz." }
      - { label: Etiketler, name: tags, widget: list, required: false, field: { label: Etiket, widget: string } }
      - { label: Meta Baslik, name: meta_title, widget: string, required: false }
      - { label: Meta Aciklama, name: meta_description, widget: text, required: false }
      - { label: Slug, name: slug, widget: string, readonly: true }
      - { label: Quality Score, name: quality_score, widget: number, required: false, readonly: true }
      - { label: Quality Status, name: quality_status, widget: string, required: false, readonly: true }
      - { label: Risk Bayragi, name: flag, widget: string, required: false, readonly: true }
      - { label: Quality Flags, name: quality_flags, widget: list, required: false, readonly: true, field: { label: Flag, widget: string } }
      - { label: Kelime Sayisi, name: quality_word_count, widget: number, required: false, readonly: true }
      - { label: Notlar, name: quality_notes, widget: list, required: false, readonly: true, field: { label: Not, widget: string } }
      - { label: Sonuc, name: processor_result, widget: text, required: false, readonly: true }

  - name: newsroom_review_archive
    label: "2b - Inceleme Arsivi"
    folder: newsroom/review/archive
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "Arsiv: {{review_status}} | Skor: {{quality_score}} | Risk: {{quality_status}} | {{title}}"
    fields: *review_fields

  - name: newsroom_ai_requests
    label: "3 - AI Haber Uretimi"
    folder: newsroom/requests/ai-article
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: topic
    summary: "{{request_status}} | {{mode}} | {{topic}}"
    fields:
      - { label: Durum, name: request_status, widget: select, default: queued, hint: "Yeni kayit normalde queued olarak acilir; bot isledikce durum guncellenir.", options: [queued, running, completed, needs_attention, hold, cancelled] }
      - { label: Konu / Input, name: topic, widget: string, hint: "AI'ye verilecek ana konu veya haber fikri." }
      - { label: Uretim Modu, name: mode, widget: select, default: full_seo_article, hint: "Genelde full_seo_article veya source_based yeterlidir.", options: [full_seo_article, short_breaking, source_based, rewrite, discover] }
      - { label: Kategori, name: category, widget: select, default: auto, hint: "Emin degilsen auto birak.", options: [auto, son-dakika, gundem, siyaset, ekonomi, dunya, spor, magazin, teknoloji, saglik] }
      - { label: Kaynak URL'leri, name: source_urls, widget: list, required: false, field: { label: URL, widget: string } }
      - { label: Dogrulanmis Ham Bilgi, name: raw_notes, widget: text, required: false, hint: "En kritik alan burasi. Kaynak notu ne kadar iyi olursa AI taslagi o kadar saglikli olur." }
      - { label: Gorsel Olustur / Bul, name: create_image, widget: boolean, default: true }
      - { label: Gorsel Talimati, name: image_instruction, widget: text, required: false, hint: "Gorsel icin ekstra yonlendirme gerekiyorsa doldur." }
      - { label: Dil, name: language, widget: select, default: Turkish, options: [Turkish, English, German] }
      - { label: Cikti Yolu, name: output_path, widget: string, required: false, readonly: true }
      - { label: Quality Score, name: quality_score, widget: number, required: false, readonly: true }
      - { label: Islem Mesaji, name: processor_message, widget: text, required: false, readonly: true }

  - name: newsroom_trend_radar
    label: "4 - Google Trend Radar"
    folder: newsroom/trends
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: query
    summary: "{{status}} | {{region}} | {{query}}"
    fields:
      - { label: Durum, name: status, widget: select, default: watching, options: [watching, suggest_articles, generate_article, checked, article_request_created, archived] }
      - { label: Aranacak Konu, name: query, widget: string }
      - { label: Bolge, name: region, widget: select, default: TR, options: [TR, US, DE, WORLD] }
      - { label: Kategori, name: category, widget: select, default: auto, options: [auto, gundem, siyaset, ekonomi, dunya, spor, magazin, teknoloji, saglik] }
      - { label: Trend Skoru, name: trend_score, widget: number, required: false, readonly: true }
      - { label: Onerilen Basliklar, name: suggested_titles, widget: list, required: false, readonly: true, field: { label: Baslik, widget: string } }
      - { label: Son Kontrol, name: checked_at, widget: string, required: false, readonly: true }

  - name: newsroom_workflow_requests
    label: "5 - Inputlu Workflow (Operasyon)"
    folder: newsroom/requests/workflow
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: request_name
    summary: "{{status}} | {{run_mode}} | {{request_name}}"
    fields:
      - label: Durum
        name: status
        widget: select
        default: queued
        hint: "Yeni kayitlar bot tarafinda approval_required durumuna cekilebilir."
        options:
          - { label: Kaydet, value: queued }
          - { label: Onay Bekliyor, value: approval_required }
          - { label: Onayla ve Calistir, value: approved_to_run }
          - { label: Tamamlandi, value: completed }
          - { label: Hata, value: failed }
          - { label: Iptal, value: cancelled }
      - { label: Talep Adi, name: request_name, widget: string, hint: "Ornek: Gece reindex kontrolu, Spor kategori yeniden calistir." }
      - label: Calisma Modu
        name: run_mode
        widget: select
        default: reindex_only
        hint: "En guvenli secenek reindex_only. Diger modlari bilincli kullan."
        options:
          - { label: Yeniden Indeksle, value: reindex_only }
          - { label: Haber Uretimi - guvenli faz bekliyor, value: website_only }
          - { label: Tum Pipeline - guvenli faz bekliyor, value: all }
      - { label: Konu Filtresi, name: selected_topic, widget: select, default: all, hint: "Tum siteyi calistirmak istemiyorsan konu sec.", options: [all, gundem, siyaset, ekonomi, dunya, spor, magazin, teknoloji, saglik] }
      - { label: Geriye Donuk Saat, name: hours_back, widget: number, default: 24, min: 1, max: 168 }
      - { label: YouTube Yuklemeyi Atla, name: skip_youtube_upload, widget: boolean, default: true }
      - { label: Ek Talimat, name: input_prompt, widget: text, required: false, hint: "Cok gerekli degilse bos birak; kisa ve net yaz." }
      - { label: Sonuc, name: execution_result, widget: text, required: false, readonly: true }

  - name: newsroom_bulk_actions
    label: "6 - Toplu Islemler (Yuksek Etki)"
    folder: newsroom/requests/bulk
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: action_name
    summary: "{{status}} | {{operation}} | {{action_name}}"
    fields:
      - { label: Islem Adi, name: action_name, widget: string, hint: "Ornek: 5 spor haberini teknoloji yerine spor yap." }
      - label: Durum
        name: status
        widget: select
        default: queued
        hint: "Toplu islemler onay mantigi ile ilerlemeli."
        options:
          - { label: Kuyruga Ekle, value: queued }
          - { label: Onay Bekliyor, value: approval_required }
          - { label: Onayla ve Calistir, value: approved_to_run }
          - { label: Tamamlandi, value: completed }
          - { label: Hata, value: failed }
          - { label: Beklet, value: hold }
          - { label: Iptal, value: cancelled }
      - { label: Islem, name: operation, widget: select, hint: "Yanlis secim birden fazla haberi etkiler.", options: [change_category, quality_recheck, seo_rebuild, noindex, reindex, set_featured] }
      - { label: Hedef Haber Sluglari, name: slugs, widget: list, hint: "Her satira bir slug gir.", field: { label: Slug, widget: string } }
      - { label: Yeni Kategori, name: category, widget: select, required: false, hint: "Sadece change_category isleminde kullanilir.", options: [Gundem, Siyaset, Ekonomi, Dunya, Spor, Magazin, Teknoloji, Saglik] }
      - { label: Not, name: note, widget: text, required: false, hint: "Neden bu toplu islemi yaptigini kisaca yazmak iyi olur." }
      - { label: Sonuc, name: result, widget: text, required: false, readonly: true }

  - name: newsroom_image_jobs
    label: "7 - Gorsel Isleme"
    folder: newsroom/requests/images
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: job_name
    summary: "{{status}} | {{preset}} | {{job_name}}"
    fields:
      - { label: Islem Adi, name: job_name, widget: string }
      - { label: Durum, name: status, widget: select, default: queued, options: [queued, completed, failed, hold, cancelled] }
      - { label: Kaynak Gorsel, name: source_image, widget: image }
      - { label: Preset, name: preset, widget: select, default: article_hero, options: [article_hero, discover, social_share, thumbnail] }
      - { label: WebP Donustur, name: convert_webp, widget: boolean, default: true }
      - { label: EXIF Temizle, name: strip_exif, widget: boolean, default: true }
      - { label: Kalite, name: quality, widget: number, default: 78, min: 40, max: 95 }
      - { label: Alt Metin, name: image_alt, widget: string, required: false }
      - { label: Ciktilar, name: outputs, widget: list, required: false, readonly: true, field: { label: Dosya, widget: string } }
      - { label: Sonuc, name: result, widget: text, required: false, readonly: true }

  - name: newsroom_reports
    label: "8 - Sistem Raporlari"
    files:
      - name: cms_source_health
        label: "CMS Kaynak Saglik Raporu"
        file: newsroom/reports/cms-source-health.md
        fields:
          - { label: Rapor, name: body, widget: text, required: false, readonly: true }
      - name: category_topic_conflicts
        label: "Kategori / Topic Uyusmazliklari"
        file: newsroom/reports/category-topic-conflicts.md
        fields:
          - { label: Rapor, name: body, widget: text, required: false, readonly: true }

  - name: newsroom_guides
    label: "9 - Kullanim Rehberi"
    files:
      - name: panel_guide
        label: "Panel Kullanim Ozeti"
        file: newsroom/status/panel-guide.md
        fields:
          - { label: Icerik, name: body, widget: text, required: false, readonly: true }
      - name: action_rules
        label: "Operasyon Kurallari"
        file: newsroom/status/action-rules.md
        fields:
          - { label: Icerik, name: body, widget: text, required: false, readonly: true }
