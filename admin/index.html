<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>mansetradar.com.tr Yonetim Paneli</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #171a1f;
      color: #eef2ff;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(220, 38, 38, 0.22), transparent 32rem),
        #171a1f;
    }

    main {
      width: min(720px, calc(100vw - 32px));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #e60000;
      color: #fff;
      font-size: 28px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1;
    }

    p {
      margin: 8px 0 0;
      color: #aab4c5;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    a {
      min-height: 150px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
    }

    a:hover,
    a:focus-visible {
      border-color: rgba(230, 0, 0, 0.8);
      outline: none;
      background: rgba(255, 255, 255, 0.09);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="logo" aria-hidden="true">H</div>
      <div>
        <h1>Yonetim Paneli</h1>
        <p>mansetradar.com.tr icin dogru araci secin.</p>
      </div>
    </div>

    <div class="grid">
      <a href="/admin/newsroom/">
        <h2>Private Newsroom</h2>
        <p>Asil editor paneli: haber taslaklari, AI istekleri, inceleme kuyrugu, sistem raporlari ve yayin onaylari.</p>
      </a>
      <a href="/admin/public/">
        <h2>Public Haber Bakimi</h2>
        <p>Yalnizca yayindaki Turkce, Ingilizce ve Almanca haberler icin bakim ve duzeltme paneli.</p>
      </a>
    </div>
  </main>
</body>
</html>
