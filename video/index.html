<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shorts | mansetradar.com.tr</title>
<meta name="description" content="Manşet Radar video haberlerini dikey Shorts akışında izleyin.">
<link rel="canonical" href="https://mansetradar.com.tr/video/">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif}a{color:#fff;text-decoration:none}button{font:inherit;color:inherit;border:0}.stage{position:fixed;inset:0;z-index:0;background:#111 center/cover no-repeat;overflow:hidden}.stage iframe{width:100%;height:100%;border:0}.feed{position:relative;z-index:1;height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}.item{height:100dvh;scroll-snap-align:start;position:relative}.touch{position:absolute;inset:0;z-index:1;background:transparent;display:grid;place-items:center}.play{width:58px;height:58px;border-radius:50%;background:rgba(17,17,17,.32);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);display:grid;place-items:center}.play:after{content:"";margin-left:4px;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:18px solid #fff}.caption{position:absolute;left:0;right:62px;bottom:max(16px,calc(env(safe-area-inset-bottom) + 10px));z-index:2;padding:12px 14px;text-shadow:0 2px 10px #000}.caption b{display:block;margin-bottom:7px;font-size:.87rem}.caption h1{font-size:1rem;line-height:1.28;margin:0 0 7px}.caption p{font-size:.79rem;margin:0;opacity:.92}.read{display:inline-block;margin-top:8px;background:#df0909;padding:8px 13px;border-radius:999px;font-size:.88rem;font-weight:700}.tools{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(136px,calc(env(safe-area-inset-bottom) + 102px));z-index:3;display:grid;gap:10px}.tool{width:42px;height:42px;border-radius:50%;background:rgba(17,17,17,.42);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);display:grid;place-items:center}.status{height:100dvh;display:grid;place-items:center;text-align:center;padding:20px}.status a{display:inline-block;margin-top:12px;background:#df0909;padding:10px 14px;border-radius:999px;font-weight:700}@media(min-width:761px){.stage{inset:22px auto 22px 50%;width:min(calc((100dvh - 44px)*.5625),420px);transform:translateX(-50%);border-radius:18px}.caption{left:calc(50% - 210px);right:auto;width:360px}.tools{right:calc(50% - 270px)}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<main class="feed" id="feed"><div class="status">Shorts videoları yükleniyor…</div></main>
<script>
(function(){
const feed=document.getElementById('feed');
const stage=document.getElementById('stage');
let activeId='';
function esc(v){return String(v||'');}
function setVideo(id){if(!id||id===activeId)return;activeId=id;stage.innerHTML='<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'?playsinline=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';stage.style.backgroundImage='url(https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg)';}
function card(v){const item=document.createElement('section');item.className='item';item.dataset.id=v.video_id;const touch=document.createElement('button');touch.className='touch';touch.type='button';touch.setAttribute('aria-label','Videoyu aç');touch.innerHTML='<span class="play" aria-hidden="true"></span>';touch.onclick=function(){setVideo(v.video_id);};item.appendChild(touch);const tools=document.createElement('div');tools.className='tools';tools.innerHTML='<button class="tool" type="button" aria-label="Beğen">♥</button><button class="tool" type="button" aria-label="Paylaş">↗</button>';tools.lastChild.onclick=function(){const u=location.origin+location.pathname+'?v='+encodeURIComponent(v.video_id);if(navigator.share)navigator.share({title:v.title||'Shorts',url:u});else navigator.clipboard&&navigator.clipboard.writeText(u);};item.appendChild(tools);const cap=document.createElement('div');cap.className='caption';const read=typeof v.news_url==='string'&&v.news_url?v.news_url:'/';cap.innerHTML='<b>@MansetRadar</b><h1></h1><p></p><a class="read" href="'+read+'">Haberi Oku</a>';cap.querySelector('h1').textContent=esc(v.title||'Manşet Radar Shorts');cap.querySelector('p').textContent=esc(v.description||'Manşet Radar Shorts içeriği.');item.appendChild(cap);return item;}
async function load(){try{const r=await fetch('./shorts-feed.json',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();const videos=(data.videos||[]).filter(v=>v&&/^[A-Za-z0-9_-]{11}$/.test(v.video_id));if(!videos.length)throw Error();const frag=document.createDocumentFragment();videos.forEach(v=>frag.appendChild(card(v)));feed.replaceChildren(frag);const items=[...feed.querySelectorAll('.item')];const q=new URL(location.href).searchParams.get('v');const first=items.find(i=>i.dataset.id===q)||items[0];setVideo(first.dataset.id);if(q)first.scrollIntoView({block:'start'});const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.65)setVideo(e.target.dataset.id);}),{threshold:[.65]});items.forEach(i=>obs.observe(i));}catch(e){feed.innerHTML='<div class="status"><div>Shorts akışı şu anda yüklenemedi.<br><a href="/">Ana sayfaya dön</a></div></div>';}}
load();
})();
</script>
</body>
</html>
