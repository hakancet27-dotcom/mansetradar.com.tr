<body>
<div class="stage" id="stage"><div class="stage-player" id="yt-player"></div></div>
<main class="feed" id="feed"><div class="status">Shorts videoları yükleniyor…</div></main>
<div class="toast" id="toast"></div>

<aside class="comments" id="comments" role="dialog" aria-modal="true" aria-label="Yorumlar" aria-hidden="true"><header><span>Yorumlar</span><button type="button" id="close">Kapat</button></header><div class="list" id="list"></div><form class="form" id="form"><input id="input" maxlength="240" placeholder="Yorum yaz" aria-label="Yorum yaz"><button>Gönder</button></form></aside>
<script>
(function(){
'use strict';
const feed=document.getElementById('feed'),stage=document.getElementById('stage'),toast=document.getElementById('toast');
const drawer=document.getElementById('comments'),shade=document.getElementById('shade'),list=document.getElementById('list'),form=document.getElementById('form'),input=document.getElementById('input');
let items=[],active=null,player=null,apiReady=false,playerReady=false,keepPlaying=false,requestedPlay=false,switching=false,snapTarget=null,snapUntil=0,currentId='',loadedId='';
function k(id,t){return 'shorts:'+id+':'+t;}function esc(v){return String(v||'');}
function notify(t){toast.textContent=t;toast.style.display='block';setTimeout(function(){toast.style.display='none';},1500);}
function vid(item){return item?item.dataset.id:'';}
function thumb(item){if(item)stage.style.backgroundImage='url(https://i.ytimg.com/vi/'+encodeURIComponent(vid(item))+'/hqdefault.jpg)';}
function showPlaying(on){items.forEach(function(i){i.classList.toggle('is-playing',on&&i===active);});}
function icon(p){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';}
const icons={heart:icon('<path d="M12 20.5S4 15.8 4 9.3A4.4 4.4 0 0 1 12 6.7 4.4 4.4 0 0 1 20 9.3c0 6.5-8 11.2-8 11.2Z"/>'),chat:icon('<path d="M4 5.5h16v11H9l-5 3v-14Z"/>'),share:icon('<path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 13v7h14v-7"/>')};
function initPlayer(){
 if(!apiReady||!active||player)return;
 loadedId=vid(active);
 player=new YT.Player('yt-player',{videoId:loadedId,playerVars:{playsinline:1,rel:0,modestbranding:1,controls:0,autoplay:0},events:{onReady:function(){playerReady=true;if(requestedPlay){requestedPlay=false;keepPlaying=true;player.playVideo();}},onStateChange:onState}});
}
function onState(e){
 if(!window.YT)return;
 if(e.data===YT.PlayerState.PLAYING){keepPlaying=true;switching=false;showPlaying(true);return;}
 if(e.data===YT.PlayerState.PAUSED){showPlaying(false);if(!switching)keepPlaying=false;return;}
 if(e.data===YT.PlayerState.ENDED){showPlaying(false);if(keepPlaying){player.seekTo(0,true);player.playVideo();}}
}
function switchTo(item,playNow){
 if(!item)return;active=item;thumb(item);
 if(!player){initPlayer();if(playNow){requestedPlay=true;keepPlaying=true;}return;}
 if(!playerReady){if(playNow){requestedPlay=true;keepPlaying=true;}return;}
 const id=vid(item);switching=true;
 if(playNow&&keepPlaying){loadedId=id;player.loadVideoById(id);player.playVideo();}
 else if(id!==loadedId){loadedId=id;player.cueVideoById(id);showPlaying(false);}
 setTimeout(function(){switching=false;},700);
}
function toggle(item){
 if(item!==active)switchTo(item,false);initPlayer();
 if(!playerReady){requestedPlay=true;keepPlaying=true;return;}
 let state=-1;try{state=player.getPlayerState();}catch(error){}
 if(window.YT&&state===YT.PlayerState.PLAYING){keepPlaying=false;switching=false;player.pauseVideo();showPlaying(false);}
 else{keepPlaying=true;if(loadedId!==vid(active)){loadedId=vid(active);player.loadVideoById(loadedId);}else{player.playVideo();}}
}
function swipeSurface(surface,item){
 let startY=null,moved=false;
 surface.addEventListener('touchstart',function(e){if(e.changedTouches.length){startY=e.changedTouches[0].clientY;moved=false;}},{passive:true});
 surface.addEventListener('touchend',function(e){if(startY===null||!e.changedTouches.length)return;const d=e.changedTouches[0].clientY-startY;startY=null;if(Math.abs(d)>42){moved=true;const target=d<0?item.nextElementSibling:item.previousElementSibling;if(target&&target.classList.contains('item')){snapTarget=target;snapUntil=Date.now()+800;switchTo(target,keepPlaying);target.scrollIntoView({block:'start',behavior:'smooth'});}}},{passive:true});
 surface.addEventListener('click',function(e){if(moved){moved=false;e.preventDefault();return;}toggle(item);});
}
function commentRows(){let rows=[];try{rows=JSON.parse(localStorage.getItem(k(currentId,'comments'))||'[]');}catch(error){}list.replaceChildren();(rows.length?rows:['İlk yorumu sen yaz.']).forEach(function(t){const d=document.createElement('div');d.className='comment';d.textContent=t;list.appendChild(d);});}
function openComments(id){currentId=id;commentRows();shade.hidden=false;requestAnimationFrame(function(){shade.classList.add('open');drawer.classList.add('open');});drawer.setAttribute('aria-hidden','false');document.body.classList.add('comments-open');input.focus();}
function closeComments(){shade.classList.remove('open');drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');document.body.classList.remove('comments-open');setTimeout(function(){shade.hidden=true;},190);}
function tool(label,cl,svg){const b=document.createElement('button');b.type='button';b.className='tool '+cl;b.setAttribute('aria-label',label);b.innerHTML=svg;return b;}
function card(v){
 const item=document.createElement('section');item.className='item';item.dataset.id=v.video_id;
 const touch=document.createElement('button');touch.className='touch';touch.type='button';touch.setAttribute('aria-label','Videoyu oynat veya durdur');touch.innerHTML='<span class="play" aria-hidden="true"></span>';swipeSurface(touch,item);item.appendChild(touch);
 const tools=document.createElement('div');tools.className='tools';const likeBox=document.createElement('div');likeBox.className='toolbox';const like=tool('Beğen','like',icons.heart);const count=document.createElement('small');count.className='count';let n=Number(localStorage.getItem(k(v.video_id,'likes'))||0);count.textContent=n?String(n):'';like.classList.toggle('active',localStorage.getItem(k(v.video_id,'liked'))==='1');like.onclick=function(){const on=localStorage.getItem(k(v.video_id,'liked'))==='1';n=Math.max(0,n+(on?-1:1));if(on)localStorage.removeItem(k(v.video_id,'liked'));else localStorage.setItem(k(v.video_id,'liked'),'1');localStorage.setItem(k(v.video_id,'likes'),String(n));like.classList.toggle('active',!on);count.textContent=n?String(n):'';};likeBox.append(like,count);tools.append(likeBox);const com=tool('Yorum yaz','',icons.chat);com.onclick=function(){openComments(v.video_id);};tools.append(com);const share=tool('Paylaş','',icons.share);share.onclick=async function(){const u=location.origin+location.pathname+'?v='+encodeURIComponent(v.video_id);try{if(navigator.share)await navigator.share({title:v.title||'Shorts',url:u});else{await navigator.clipboard.writeText(u);notify('Link kopyalandı');}}catch(error){}};tools.append(share);item.appendChild(tools);
 const cap=document.createElement('div');cap.className='caption';const author=document.createElement('b');author.textContent='@ManşetRadarHaber';const title=document.createElement('h1');title.textContent=esc(v.title||'ManşetRadar Haber Shorts');const desc=document.createElement('p');desc.textContent=esc(v.description||'ManşetRadar Haber Shorts içeriği.');const read=document.createElement('a');read.className='read';read.textContent='Haberi Oku';read.href=typeof v.news_url==='string'&&v.news_url&&v.news_url!=='/haber/'?v.news_url:'/';cap.append(author,title,desc,read);item.appendChild(cap);return item;
}
async function load(){
 try{const r=await fetch('./shorts-feed.json',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();const seen=new Set();const videos=(data.videos||[]).filter(function(v){if(!v||!/^[A-Za-z0-9_-]{11}$/.test(v.video_id)||seen.has(v.video_id))return false;seen.add(v.video_id);return true;});if(!videos.length)throw Error();const frag=document.createDocumentFragment();videos.forEach(function(v){frag.appendChild(card(v));});feed.replaceChildren(frag);items=Array.from(feed.querySelectorAll('.item'));const q=new URL(location.href).searchParams.get('v');active=items.find(function(i){return i.dataset.id===q;})||items[0];thumb(active);if(q)active.scrollIntoView({block:'start'});const observer=new IntersectionObserver(function(entries){entries.forEach(function(e){if(!e.isIntersecting||e.intersectionRatio<.65)return;if(Date.now()<snapUntil&&snapTarget&&e.target!==snapTarget)return;if(e.target!==active)switchTo(e.target,keepPlaying);if(e.target===snapTarget)snapTarget=null;});},{threshold:[.65]});items.forEach(function(i){observer.observe(i);});}catch(error){feed.innerHTML='<div class="status"><div>Shorts akışı şu anda yüklenemedi.<br><a href="/">Ana sayfaya dön</a></div></div>';}
}
window.onYouTubeIframeAPIReady=function(){apiReady=true;if(requestedPlay&&active)initPlayer();};
document.getElementById('close').onclick=closeComments;shade.onclick=closeComments;form.onsubmit=function(e){e.preventDefault();const v=input.value.trim();if(!v||!currentId)return;let a=[];try{a=JSON.parse(localStorage.getItem(k(currentId,'comments'))||'[]');}catch(error){}a.push(v);localStorage.setItem(k(currentId,'comments'),JSON.stringify(a.slice(-50)));input.value='';commentRows();};load();
})();
</script>
