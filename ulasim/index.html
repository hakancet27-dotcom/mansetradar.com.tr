    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red: #e10600;
      --red-dark: #a80000;
      --dark: #171727;
      --surface: #ffffff;
      --page: #f4f6f8;
      --border: #e1e5ea;
      --text: #24292f;
      --muted: #667085;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.07);

    body.dark-mode {

      --border: #1e293b;
      --text: #f1f5f9;

      --shadow-strong: 0 10px 30px rgba(0, 0, 0, 0.6);

    }
    body.dark-mode .market-strip {

      border-color: #334155;
    }
    body.dark-mode .market-item {
      background: #0f172a;
      border-color: #334155;
    }
    body.dark-mode .header-search {
      background: #1e293b;
      border-color: #334155;
    }
    body.dark-mode .header-search input {

    }
    body.dark-mode .news-card, body.dark-mode .topic-card, body.dark-mode .istanbul-card {

    body.dark-mode .news-card a, body.dark-mode .topic-card a, body.dark-mode .istanbul-card a {

    body.dark-mode .topic-link {

    }
    .theme-toggle-btn {

      border-radius: 8px;
      width: 38px;
      height: 38px;
      display: inline-flex;

      justify-content: center;

      transition: all .2s;
    }
    .theme-toggle-btn:hover {

    }
    body.dark-mode .theme-toggle-btn {

      border-color: #334155;

    }

    .trending-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 7px 0;
      font-size: 0.82rem;
    }
    body.dark-mode .trending-bar {
      background: #0f172a;
      border-color: #1e293b;
    }
    .trending-bar .inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .trending-label {
      font-weight: 800;
      color: var(--red);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      font-size: 0.78rem;
      letter-spacing: 0.4px;
    }
    .trending-items {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .trending-items::-webkit-scrollbar { display: none; }
    .trending-item {
      background: #f1f5f9;
      color: #334155;
      padding: 3px 10px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.76rem;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .trending-item:hover {
      background: #fee2e2;
      color: var(--red);
    }
    body.dark-mode .trending-item {
      background: #1e293b;
      color: #cbd5e1;
    }
    body.dark-mode .trending-item:hover {
      background: #3f1515;
      color: #f87171;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--page);
      color: var(--text);
      line-height: 1.55;
    }


    a { color: inherit; }
    .skip-link {
      position: absolute;
      left: -999px;
      top: 8px;
      background: var(--dark);
      color: white;
      padding: 8px 12px;
      z-index: 999;
    }
    .skip-link:focus { left: 8px; }

    .top-bar {
      background: var(--dark);
      color: #c8c8d4;
      font-size: 0.75rem;
      padding: 6px 0;
    }
    .top-bar .inner,
    header .inner,
    .breaking .inner,
    .container,
    footer .inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .top-bar .inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .top-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .top-bar a {
      color: #c8c8d4;
      text-decoration: none;
    }
    .top-bar a:hover { color: white; }

    header {
      background: var(--surface);
      border-bottom: 3px solid var(--red);
      padding: 14px 0;
      box-shadow: var(--shadow);
      z-index: 100;
    }
    @media (min-width: 901px) {
      header {
        position: sticky;
        top: 0;
      }
    }
    header .inner {
      display: grid;
      grid-template-columns: auto minmax(320px, 1fr) auto auto;
      align-items: center;
      gap: 20px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      background: var(--red);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
    }
    .logo-text strong {
      display: block;
      font-size: 1.2rem;
      color: var(--dark);
      letter-spacing: 0;
    }
    .logo-text span {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .market-strip {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 0;
    }
    .market-strip::-webkit-scrollbar { display: none; }
    .market-label {
      flex: 0 0 auto;
      background: linear-gradient(135deg, #111727, #222d46);
      color: white;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.2px;
      box-shadow: 0 6px 14px rgba(10, 18, 34, 0.2);
    }
    .market-item {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: white;
      padding: 8px 12px;
      line-height: 1;
      box-shadow: 0 5px 12px rgba(15, 23, 42, 0.08);
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .market-name {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 900;
    }
    .market-value {
      color: var(--dark);
      font-size: 1.04rem;
      font-weight: 900;
      min-width: 52px;
      text-align: right;
      letter-spacing: 0;
    }
    .market-change {
      font-size: 0.78rem;
      font-weight: 900;
      min-width: 52px;
      padding: 2px 5px;
      border-radius: 999px;
      text-align: center;
    }
    .market-item.up {
      border-color: rgba(18, 128, 92, 0.42);
      background: #ecfdf3;
      box-shadow: 0 5px 16px rgba(18, 128, 92, 0.13);
    }
    .market-item.down {
      border-color: rgba(180, 35, 24, 0.42);
      background: #fff1f0;
      box-shadow: 0 5px 16px rgba(180, 35, 24, 0.12);
    }
    .market-item.up .market-value,
    .market-change.up { color: #064e3b; }
    .market-item.down .market-value,
    .market-change.down { color: #7f1d1d; }
    .market-change.up { background: #065f46; color: #ffffff; }
    .market-change.down { background: #991b1b; color: #ffffff; }
    .market-item.neutral .market-change {
      color: #334155;
      background: #eef2f7;
    }
    .market-status {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }
    nav {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    nav a {
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
    }
    nav a:hover { background: var(--page); color: var(--red); }
    nav a.active { background: var(--red); color: white; }

    .breaking {
      background: var(--red);
      color: white;
      padding: 0;
      border-top: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.18);
    }
    .breaking .inner {
      display: flex;
      align-items: center;
      gap: 18px;
      overflow-x: auto;
      scrollbar-width: none;
      min-height: 48px;
    }
    .breaking .inner::-webkit-scrollbar { display: none; }
    .breaking-label {
      color: #ffffff;
      font-weight: 900;
      font-size: 0.68rem;
      padding: 0;
      white-space: nowrap;
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }
    .topic-list {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 0;
    }
    .topic-link {
      position: relative;
      flex: 0 0 auto;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 900;
      line-height: 48px;
      padding: 0 13px;
      opacity: 0.88;
      transition: opacity 0.2s, color 0.2s;
    }
    .topic-link + .topic-link::before {
      content: "";
      position: absolute;
      left: 0;
      top: 15px;
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,0.22);
    }
    .topic-link::after {
      content: "";
      position: absolute;
      left: 13px;
      right: 13px;
      bottom: 0;
      height: 3px;
      background: transparent;
    }
    .topic-link:hover,
    .topic-link.is-active {
      color: white;
      opacity: 1;
    }
    .topic-link:hover::after,
    .topic-link.is-active::after {
      background: white;
    }
    .topic-link.primary,
    .topic-link.primary.is-active {
      color: white;
      opacity: 1;
    }
    .topic-link.primary::after {
      color: white;
      background: white;
    }

    .container { margin: 30px auto; }
    .page-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 30px;
      align-items: start;
    }
    .page-heading {
      font-size: 1.9rem;
      color: var(--dark);
      letter-spacing: 0;
      margin-bottom: 6px;
    }
    .page-intro {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .empty-state {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      padding: 18px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .turkey-showcase {
      margin-bottom: 42px;
      scroll-margin-top: 90px;
    }
    .showcase-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }
    .showcase-kicker {
      color: var(--red);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      margin-bottom: 3px;
    }
    .showcase-title {
      color: var(--dark);
      font-size: 1.9rem;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .showcase-note {
      color: var(--muted);
      font-size: 0.86rem;
      text-align: right;
      max-width: 250px;
    }
    .showcase-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.85fr);
      gap: 18px;
      align-items: stretch;
    }
    .headline-slider {
      position: relative;
      height: 456px;
      border-radius: 8px;
      overflow: hidden;
      background: #11131f;
      box-shadow: var(--shadow-strong);
    }
    .headline-slide {
      position: absolute;
      inset: 0;
      display: block;
      color: white;
      text-decoration: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .headline-slide.is-active {
      opacity: 1;
      pointer-events: auto;
    }
    .headline-card {
      position: relative;
      color: white;
      overflow: hidden;
      background: var(--dark);
      min-width: 0;
    }
    .headline-slider .headline-slide {
      position: absolute;
      inset: 0;
      height: 100%;
    }
    .headline-image,
    .headline-placeholder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .headline-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }
    .headline-card:hover .headline-image img { transform: scale(1.04); }
    .headline-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.88);
      font-size: 4.8rem;
      font-weight: 900;
      isolation: isolate;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.16), transparent 24%),
        radial-gradient(circle at 85% 15%, rgba(192,57,43,0.5), transparent 26%),
        linear-gradient(135deg, #121524 0%, #25283a 46%, #9d2d22 100%);
    }
    .headline-placeholder::before,
    .headline-placeholder::after {
      content: "";
      position: absolute;
      inset: auto;
      z-index: -1;
      opacity: 0.8;
      transform: rotate(-12deg);
    }
    .headline-placeholder::before {
      width: 62%;
      height: 130px;
      left: -12%;
      top: 16%;
      border-top: 2px solid rgba(255,255,255,0.16);
      border-bottom: 2px solid rgba(255,255,255,0.08);
    }
    .headline-placeholder::after {
      width: 44%;
      height: 180px;
      right: -10%;
      bottom: 10%;
      background: rgba(255,255,255,0.06);
      border-left: 1px solid rgba(255,255,255,0.14);
    }
    .headline-placeholder span {
      border: 2px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      padding: 0.18em 0.38em;
      background: rgba(0,0,0,0.16);
      text-shadow: 0 5px 20px rgba(0,0,0,0.36);
    }
    .headline-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.86), rgba(0,0,0,0.35) 48%, rgba(0,0,0,0.06));
      z-index: 1;
    }
    .headline-content {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      z-index: 2;
    }
    .headline-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .headline-tag,
    .headline-topic {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 0.72rem;
      font-weight: 900;
      line-height: 1;
    }
    .headline-tag { background: var(--red); color: white; }
    .headline-topic { background: rgba(255,255,255,0.92); color: var(--red); }
    .headline-title {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      max-width: 92%;
      overflow: hidden;
      font-size: clamp(1.45rem, 2vw, 1.86rem);
      line-height: 1.16;
      letter-spacing: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .headline-slider .headline-content {
      right: 92px;
    }
    .headline-date {
      display: inline-block;
      color: rgba(255,255,255,0.82);
      font-size: 0.82rem;
      margin-top: 10px;
    }
    .slider-controls {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 4;
      display: flex;
      gap: 8px;
    }
    .slider-dots {
      position: absolute;
      left: 50%;
      bottom: 16px;
      z-index: 5;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      max-width: calc(100% - 120px);
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .slider-dots::-webkit-scrollbar { display: none; }
    .slider-dot {
      min-width: 26px;
      height: 26px;
      border: 0;
      border-radius: 6px;
      padding: 0 6px;
      background: rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.92);
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .slider-dot:hover,
    .slider-dot:focus-visible {
      background: rgba(255, 255, 255, 0.38);
      color: #ffffff;
      transform: translateY(-1px);
      outline: none;
    }
    .slider-dot.is-active {
      min-width: 32px;
      background: #e10600;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(225, 6, 0, 0.55);
      font-weight: 900;
    }
    .slider-btn {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,0.42);
      border-radius: 999px;
      background: rgba(0,0,0,0.42);
      color: white;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1;
    }
    .slider-btn:hover { background: var(--red); }
    .headline-slider.has-image-active .headline-slide.is-active .headline-placeholder {
      opacity: 0;
    }
    .side-headlines {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .side-headlines.is-rotating .side-headline.is-side-rotation-hidden {
      display: none !important;
    }
    .side-headline {
      min-height: 100px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      text-decoration: none;
    }
    .side-headline .headline-content {
      left: 14px;
      right: 14px;
      bottom: 12px;
    }
    .side-headline .headline-title {
      font-size: 1rem;
      line-height: 1.24;
      -webkit-line-clamp: 3;
      max-width: 100%;
    }
    .side-headline .headline-meta {
      margin-bottom: 7px;
    }
    .side-headline .headline-tag,
    .side-headline .headline-topic {
      font-size: 0.66rem;
      padding: 3px 7px;
    }
    .headline-card.has-text-image {
      background:
        radial-gradient(circle at 18% 20%, rgba(255,255,255,0.14), transparent 24%),
        radial-gradient(circle at 82% 16%, rgba(225,6,0,0.35), transparent 28%),
        linear-gradient(135deg, #0f172a, #1f2937 52%, #7f1d1d);
    }
    .headline-card.has-text-image .headline-image img {
      opacity: 0;
    }
    .headline-card.has-text-image::after {
      background: linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0.24) 58%, rgba(0,0,0,0.02));
    }

    .headline-trust {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #059669;
      color: white;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }
    .headline-read-time {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .live-stream-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #dc2626;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      animation: pulse-border 2s infinite;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      display: inline-block;
      animation: pulse-dot 1.2s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(0.9); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); }
      50% { box-shadow: 0 0 0 5px rgba(220, 38, 38, 0); }
    }

    /* ISTANBUL_SHOWCASE_STYLES */
    .istanbul-showcase {
      margin-bottom: 48px;
      background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%);
      border: 1px solid #d0e1f9;
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .istanbul-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 2px solid #bfdbfe;
    }
    .istanbul-kicker {
      display: inline-block;
      color: #1d4ed8;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .istanbul-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--dark);
      line-height: 1.2;
    }
    .istanbul-desc {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 4px;
    }
    .istanbul-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .istanbul-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffffff;
      border: 1px solid #93c5fd;
      color: #1e40af;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 1px 3px rgba(30, 64, 175, 0.08);
    }
    .istanbul-chip:hover {
      background: #1e40af;
      color: #ffffff;
      border-color: #1e40af;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(30, 64, 175, 0.25);
    }
    .istanbul-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .istanbul-card {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .istanbul-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-strong);
      border-color: #93c5fd;
    }
    .istanbul-card-link {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .istanbul-card-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #e2e8f0;
      overflow: hidden;
    }
    .istanbul-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .istanbul-card:hover .istanbul-card-img img {
      transform: scale(1.05);
    }
    .istanbul-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      color: #fff;
      font-size: 1.4rem;
      font-weight: 900;
    }
    .istanbul-card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .istanbul-card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .istanbul-badge {
      background: #dbeafe;
      color: #1e40af;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .istanbul-topic {
      background: #f1f5f9;
      color: #475569;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .istanbul-card-title {
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--dark);
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      flex: 1;
    }
    .istanbul-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f1f5f9;
      padding-top: 8px;
      margin-top: auto;
      font-size: 0.75rem;
    }
    .istanbul-source {
      color: #64748b;
      font-weight: 600;
    }
    .istanbul-more {
      color: #1d4ed8;
      font-weight: 800;
    }
    @media (max-width: 768px) {
      .istanbul-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .istanbul-showcase {
        padding: 16px;
      }
      .istanbul-title {
        font-size: 1.35rem;
      }
    }

    /* CITY_METRICS_BAR */
    .city-metrics-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 18px 0;
    }
    .city-metric {
      background: #ffffff;
      border: 1px solid #d0e1f9;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .city-metric:hover {
      transform: translateY(-2px);
      border-color: #3b82f6;
    }
    .metric-icon {
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .metric-body {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .metric-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .metric-body strong {
      font-size: 0.92rem;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CITY_ALERTS_BOX */
    .city-alerts-box {
      background: #ffffff;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 16px 20px;
      margin: 20px 0 24px;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.05);
    }
    .city-alerts-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.82rem;
      font-weight: 900;
      color: #b91c1c;
      letter-spacing: 0.4px;
      padding-bottom: 12px;
      border-bottom: 1px dashed #fca5a5;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .city-alerts-header a {
      color: #1e40af;
      font-weight: 800;
      text-decoration: none;
    }
    .city-alerts-header a:hover {
      text-decoration: underline;
    }
    .city-alerts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .city-alert-item {
      display: flex;
      gap: 10px;
      background: #fff5f5;
      border: 1px solid #fee2e2;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.82rem;
    }
    .city-alert-badge {
      background: #dc2626;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 4px;
      height: max-content;
      flex-shrink: 0;
    }
    .city-alert-content {
      flex: 1;
      min-width: 0;
    }
    .city-alert-content strong {
      display: block;
      color: #0f172a;
      font-size: 0.84rem;
      margin-bottom: 2px;
    }
    .city-alert-content p {
      color: #475569;
      margin: 0;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    /* SLIDER_PROGRESS_BAR */
    .slider-progress-track {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      z-index: 10;
      overflow: hidden;
    }
    .slider-progress-fill {
      height: 100%;
      width: 0%;
      background: #e10600;
      box-shadow: 0 0 10px rgba(225, 6, 0, 0.8);
      transition: width 0.1s linear;
    }

    .country-section { margin-bottom: 52px; scroll-margin-top: 90px; }
    .country-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }
    .country-flag { font-size: 2rem; line-height: 1; }
    .country-title {
      font-size: 1.32rem;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: 0;
    }
    .country-subtitle {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .country-divider {
      flex: 1;
      height: 2px;
      background: linear-gradient(to right, var(--red), transparent);
      margin-left: 10px;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }
    .news-grid .news-card:first-child { grid-column: span 2; }
    .news-card {
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .news-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-strong);
    }
    .card-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #dfe3e8;
    }
    .news-card:first-child .card-image { aspect-ratio: 2.1 / 1; }
    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .news-card:hover .card-image img { transform: scale(1.04); }
    .card-image-placeholder {
      background:
        linear-gradient(135deg, rgba(192,57,43,0.92), rgba(23,23,39,0.95)),
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.15), transparent 30%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-image-placeholder span {
      color: rgba(255,255,255,0.82);
      font-size: 2.5rem;
      font-weight: 800;
    }
    .card-body {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .card-category {
      background: #fee2e2;
      color: #7f1d1d;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      text-transform: none;
    }
    .card-topic {
      background: #eef2f7;
      color: #344054;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }
    .card-date {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .card-title {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.42;
      margin-bottom: 10px;
      letter-spacing: 0;
    }
    .news-card:first-child .card-title { font-size: 1.25rem; }
    .card-title a {
      color: var(--text);
      text-decoration: none;
    }
    .card-title a:hover { color: var(--red); }
    .card-excerpt {
      color: var(--muted);
      font-size: 0.86rem;
      margin-bottom: 12px;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .read-more {
      color: var(--red);
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
    }
    .read-more:hover { text-decoration: underline; }

    .sidebar {
      position: sticky;
      top: 96px;
      max-height: calc(100vh - 110px);
      overflow: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: #d0d5dd transparent;
    }
    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 999px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar-widget,
    .youtube-widget {
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .sidebar-widget {
      background: var(--surface);
      padding: 20px;
    }
    .widget-title {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--red);
    }
    .country-filter {
      list-style: none;
      display: grid;
      gap: 2px;
    }
    .country-filter a {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      text-decoration: none;
      color: var(--text);
    }
    .country-filter li:last-child a { border-bottom: none; }
    .country-filter a:hover { color: var(--red); }
    .country-filter .count {
      margin-left: auto;
      background: var(--page);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .latest-news-list {
      list-style: none;
      display: grid;
      gap: 12px;
    }
    .latest-news-list li {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .latest-news-list li:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .latest-news-list a {
      display: block;
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1.35;
    }
    .latest-news-list a:hover { color: var(--red); }
    .latest-news-list span {
      display: inline-block;
      margin-bottom: 4px;
      color: var(--red);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .weather-list {
      list-style: none;
      display: grid;
      gap: 10px;
    }
    .weather-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fbfcfe;
    }
    .weather-city {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text);
    }
    .weather-temp {
      font-size: 1rem;
      font-weight: 900;
      color: var(--dark);
    }
    .weather-meta {
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 700;
    }
    .youtube-widget {
      background: linear-gradient(135deg, #d91f1f, #b31313);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .youtube-widget .yt-icon { font-size: 2.2rem; margin-bottom: 10px; }
    .youtube-widget h3 { font-size: 1rem; margin-bottom: 8px; }
    .youtube-widget p { font-size: 0.82rem; opacity: 0.92; margin-bottom: 15px; }
    .youtube-widget a {
      background: white;
      color: #b31313;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-block;
    }
    .info-text {
      color: var(--muted);
      font-size: 0.86rem;
    }
    .info-text strong { color: var(--text); }

    .load-more-btn {
      display: block;
      margin: 20px auto 0;
      padding: 12px 30px;
      background: white;
      color: var(--red);
      border: 2px solid var(--red);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .load-more-btn:hover {
      background: var(--red);
      color: white;
    }

    footer {
      background: var(--dark);
      color: #bfc0cc;
      padding: 40px 0 20px;
      margin-top: 60px;
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 34px;
      margin-bottom: 30px;
    }
    footer h4 {
      color: white;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }
    footer p,
    footer a {
      font-size: 0.85rem;
      color: #bfc0cc;
      text-decoration: none;
      line-height: 2;
      display: block;
    }
    footer a:hover { color: white; }
    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,0.12);
      padding-top: 20px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .footer-bottom a {
      display: inline;
      color: #ffb0a8;
    }

    @media (max-width: 900px) {
      .top-bar .inner,
      header .inner {
        display: flex;
        flex-direction: column;
        text-align: center;
      }
      .market-strip {
        width: 100%;
        justify-content: flex-start;
        padding-bottom: 2px;
      }
      .page-layout { grid-template-columns: 1fr; }
      .showcase-grid { grid-template-columns: 1fr; }
      .headline-slider { height: 380px; }
      .side-headlines {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .sidebar {
        position: static;
        display: grid;
        grid-template-columns: 1fr;
        max-height: none;
        overflow: visible;
      }
      .news-grid { grid-template-columns: 1fr; }
      .news-grid .news-card:first-child { grid-column: span 1; }
      .news-card:first-child .card-image { aspect-ratio: 16 / 9; }
      .footer-grid { grid-template-columns: 1fr; gap: 22px; }
    }
    @media (max-width: 600px) {
      .container { margin-top: 24px; padding: 0 18px; }
      .top-links { justify-content: center; flex-wrap: wrap; }
      .breaking .inner { padding-right: 0; }
      .topic-list { padding-right: 18px; }
      .topic-link { font-size: 0.8rem; padding: 0 10px; }
      .topic-link::after { left: 10px; right: 10px; }
      .market-item { padding: 6px 9px; }
      .market-label { padding: 6px 8px; }
      .page-heading { font-size: 1.65rem; }
      .showcase-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
      .showcase-note { text-align: left; max-width: none; }
      .showcase-title { font-size: 1.55rem; }
      .headline-slider { height: 330px; }
      .headline-title { font-size: 1.45rem; }
      .headline-content {
        left: 16px;
        right: 72px;
        bottom: 16px;
      }
      .side-headlines { grid-template-columns: 1fr; }
      .side-headline { min-height: 118px; }
      .country-header { align-items: flex-start; }
      .country-divider { display: none; }
      .card-body { padding: 17px; }
      .news-card:first-child .card-title { font-size: 1.1rem; }
    }

    @media (min-width: 901px) {
      .showcase-grid .side-headlines {
        position: relative;
        height: 456px;
        max-height: 456px;
        display: grid;
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 14px;
        overflow: hidden;
      }
      .showcase-grid .side-headlines .side-headline {
        min-height: 0;
        height: 221px;
        overflow: hidden;
      }
      .showcase-grid .side-headlines:not(.is-rotating) .side-headline:nth-of-type(n+3),
      .showcase-grid .side-headlines.is-rotating .side-headline.is-side-rotation-hidden {
        display: none !important;
      }
    }


    /* CODEX_ENHANCEMENTS_START */
    .header-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
      justify-content: flex-end;
    }
    .header-search {
      width: 42px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      border: 1px solid rgba(225,6,0,.24);
      border-radius: 999px;
      background: #fff;
      padding: 0 10px;
      overflow: hidden;
      cursor: text;
      transition: width .22s ease, border-color .22s ease, box-shadow .22s ease;
    }
    .header-search.is-open,
    .header-search:focus-within {
      width: min(320px, 34vw);
      border-color: rgba(225,6,0,.58);
      box-shadow: 0 8px 22px rgba(225,6,0,.12);
    }
    .search-icon {
      color: var(--red);
      font-weight: 900;
      font-size: 1rem;
      line-height: 1;
      flex: 0 0 auto;
    }
    .header-search input {
      width: 0;
      min-width: 0;
      border: 0;
      outline: 0;
      opacity: 0;
      font: inherit;
      color: var(--text);
      transition: width .22s ease, opacity .18s ease;
    }
    .header-search.is-open input,
    .header-search:focus-within input {
      width: 100%;
      opacity: 1;
    }
    .header-search button {
      border: 0;
      background: #f3f4f6;
      color: #4b5563;
      border-radius: 999px;
