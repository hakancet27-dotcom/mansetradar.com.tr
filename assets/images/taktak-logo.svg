<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="targetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a5a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGradient)" />
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="600" y2="100" stroke="#00d4ff" stroke-width="1"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#00d4ff" stroke-width="1"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#00d4ff" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="#00d4ff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#00d4ff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#00d4ff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#00d4ff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="#00d4ff" stroke-width="1"/>
  </g>
  
  <!-- Main eye shape -->
  <ellipse cx="300" cy="180" rx="120" ry="70" fill="url(#eyeGradient)" opacity="0.3"/>
  
  <!-- Eye outer circle -->
  <circle cx="300" cy="180" r="80" fill="none" stroke="url(#eyeGradient)" stroke-width="3"/>
  
  <!-- Eye inner circle -->
  <circle cx="300" cy="180" r="50" fill="url(#eyeGradient)" opacity="0.6"/>
  
  <!-- Pupil -->
  <circle cx="300" cy="180" r="25" fill="#1a1a2e"/>
  
  <!-- Pupil highlight -->
  <circle cx="290" cy="170" r="8" fill="#00d4ff" opacity="0.8"/>
  
  <!-- Crosshair target -->
  <g stroke="url(#targetGradient)" stroke-width="2">
    <line x1="300" y1="80" x2="300" y2="120"/>
    <line x1="300" y1="240" x2="300" y2="280"/>
    <line x1="220" y1="180" x2="260" y2="180"/>
    <line x1="340" y1="180" x2="380" y2="180"/>
  </g>
  
  <!-- Target circles -->
  <circle cx="300" cy="180" r="95" fill="none" stroke="url(#targetGradient)" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="180" r="110" fill="none" stroke="url(#targetGradient)" stroke-width="1" opacity="0.3"/>
  
  <!-- Text -->
  <text x="300" y="320" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00d4ff" text-anchor="middle">TAKTAK</text>
  <text x="300" y="355" font-family="Arial, sans-serif" font-size="18" fill="#666" text-anchor="middle">Göz ve Kafa Takibi Oyunu</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="500" cy="100" r="5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="100" cy="300" r="5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="500" cy="300" r="5" fill="#00d4ff" opacity="0.5"/>
</svg>
