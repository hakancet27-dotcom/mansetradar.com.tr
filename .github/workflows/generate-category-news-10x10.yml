name: Generate Category News 10x10

# KATEGORİ HABERİ ÜRETME WORKFLOW'U
#
# Ne yapar?
# - Public site reposu içinde RSS/YouTube kaynaklarından kategori bazlı haber adayları
#   üretir.
# - JSON ve HTML makale dosyaları oluşturabilir.
# - `newsroom/generated` altında üretim raporu yazabilir.
# - Değişiklik varsa public site reposuna commit/push yapabilir.
#
# Ne zaman çalışır?
# - Otomatik çalışmaz.
# - Yalnızca GitHub Actions ekranından bilinçli olarak manuel başlatılmalıdır.
#
# Yetki ve risk notu:
# - `contents: write` yetkisine sahiptir.
# - Ana haber üretimi normalde haber-botu reposundaki ana pipeline üzerinden
#   yürütülmelidir; bu workflow geçici/kontrollü kategori tamamlama içindir.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate sourced category news candidates
        run: |
          python - <<'PY'
          import email.utils
          import hashlib
          import html
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          CATEGORIES = {
              'Son Dakika': [
                  'https://www.trthaber.com/sondakika_articles.rss',
              ],
              'Gündem': [
                  'https://www.trthaber.com/gundem_articles.rss',
              ],
              'Siyaset': [
                  'https://www.trthaber.com/politika_articles.rss',
                  'https://www.trthaber.com/gundem_articles.rss',
              ],
              'Ekonomi': [
                  'https://www.trthaber.com/ekonomi_articles.rss',
              ],
              'Dünya': [
                  'https://www.trthaber.com/dunya_articles.rss',
              ],
              'Spor': [
                  'https://www.trthaber.com/spor_articles.rss',
              ],
              'Magazin': [
                  'https://www.trthaber.com/magazin_articles.rss',
              ],
              'Teknoloji': [
                  'https://www.trthaber.com/bilim-teknoloji_articles.rss',
              ],
              'Sağlık': [
                  'https://www.trthaber.com/saglik_articles.rss',
              ],
              'Video': [
                  'https://www.youtube.com/feeds/videos.xml?channel_id=UCNartanesiHaber',
                  'https://www.youtube.com/feeds/videos.xml?user=NartanesiHaber',
              ],
          }

          CATEGORY_SLUG = {
              'Son Dakika': 'son-dakika',
              'Gündem': 'gundem',
              'Siyaset': 'siyaset',
              'Ekonomi': 'ekonomi',
              'Dünya': 'dunya',
              'Spor': 'spor',
              'Magazin': 'magazin',
              'Teknoloji': 'teknoloji',
              'Sağlık': 'saglik',
              'Video': 'video',
          }

          def strip_html(value):
              value = html.unescape(value or '')
              value = re.sub(r'<[^>]+>', ' ', value)
              value = re.sub(r'\s+', ' ', value).strip()
              return value

          def slugify(text):
              table = str.maketrans('çğıöşüÇĞİÖŞÜ', 'cgiosuCGIOSU')
              text = (text or '').translate(table).lower()
              text = re.sub(r'[^a-z0-9]+', '-', text).strip('-')
              return text[:82] or 'haber'

          def parse_date(value):
              if not value:
                  return datetime.now(timezone.utc)
              try:
                  dt = email.utils.parsedate_to_datetime(value)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return datetime.now(timezone.utc)

          def fetch_feed(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'hakancetin-news-generator/1.0'})
              with urllib.request.urlopen(req, timeout=20) as res:
                  return res.read()

          def parse_feed(raw):
              root = ET.fromstring(raw)
              items = []
              # RSS
              for item in root.findall('.//item'):
                  title = strip_html(item.findtext('title'))
                  link = strip_html(item.findtext('link'))
                  desc = strip_html(item.findtext('description'))
                  pub = item.findtext('pubDate') or item.findtext('date')
                  image = ''
                  enclosure = item.find('enclosure')
                  if enclosure is not None:
                      image = enclosure.attrib.get('url', '')
                  if title and link:
                      items.append({'title': title, 'link': link, 'summary': desc, 'date': parse_date(pub), 'image': image})
              # Atom / YouTube
              ns = {'a': 'http://www.w3.org/2005/Atom', 'media': 'http://search.yahoo.com/mrss/'}
              for entry in root.findall('.//a:entry', ns):
                  title = strip_html(entry.findtext('a:title', default='', namespaces=ns))
                  link_el = entry.find('a:link', ns)
                  link = link_el.attrib.get('href', '') if link_el is not None else ''
                  desc = strip_html(entry.findtext('media:group/media:description', default='', namespaces=ns))
                  pub = entry.findtext('a:published', default='', namespaces=ns) or entry.findtext('a:updated', default='', namespaces=ns)
                  thumb_el = entry.find('media:group/media:thumbnail', ns)
                  image = thumb_el.attrib.get('url', '') if thumb_el is not None else ''
                  if title and link:
                      items.append({'title': title, 'link': link, 'summary': desc, 'date': parse_date(pub), 'image': image})
              return items

          def build_html_article(data):
              title = html.escape(data['title'])
              summary = html.escape(data['summary'])
              source_url = html.escape(data['source_url'])
              category = html.escape(data['category'])
              date_iso = data['date_iso']
              image = html.escape(data.get('image_url') or '')
              img_html = f'<figure class="article-image"><img src="{image}" alt="{title}" loading="eager" width="1280" height="720"></figure>' if image else ''
              return f'''<!DOCTYPE html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="{summary[:155]}">
            <meta name="robots" content="index,follow,max-image-preview:large">
            <link rel="canonical" href="https://mansetradar.com.tr/articles/{data['slug']}/">
            <title>{title} | mansetradar.com.tr</title>
            <style>
              body{{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f6f8;color:#20242a;line-height:1.7}}
              header{{background:#fff;border-bottom:3px solid #e10600;padding:16px 20px}}
              header a{{color:#171729;text-decoration:none;font-weight:900}}
              main{{max-width:900px;margin:28px auto;background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(15,23,42,.08);padding:28px}}
              h1{{font-size:clamp(1.7rem,3vw,2.5rem);line-height:1.15;margin:0 0 12px}}
              .meta{{display:flex;gap:8px;flex-wrap:wrap;color:#667085;font-size:.9rem;margin-bottom:16px}}
              .meta span{{background:#f1f5f9;border-radius:999px;padding:4px 9px}}
              .spot{{border-left:5px solid #e10600;background:#fff8f7;padding:12px 16px;font-size:1.08rem}}
              .source{{margin-top:22px;padding-top:16px;border-top:1px solid #e5e7eb}}
              .source a{{color:#e10600;font-weight:800}}
              .article-image img{{width:100%;border-radius:10px;object-fit:cover;aspect-ratio:16/9}}
            </style>
          </head>
          <body>
            <header><a href="/haber/">← mansetradar.com.tr Haberler</a></header>
            <main>
              <div class="meta"><span>{category}</span><span>{date_iso}</span><span>Kaynaklı haber adayı</span></div>
              <h1>{title}</h1>
              {img_html}
              <p class="spot">{summary}</p>
              <p>Bu içerik, kaynak akışından alınan doğrulanabilir haber bilgisiyle oluşturulan haber adayıdır. Ayrıntılar ve güncel bağlam için birincil kaynak bağlantısı korunmuştur.</p>
              <div class="source"><strong>Kaynak:</strong> <a href="{source_url}" target="_blank" rel="noopener nofollow">Haberi kaynağında oku</a></div>
            </main>
          </body>
          </html>
          '''

          generated = []
          failed = []
          seen_links = set()
          for category, urls in CATEGORIES.items():
              collected = []
              for url in urls:
                  try:
                      items = parse_feed(fetch_feed(url))
                      collected.extend(items)
                  except Exception as exc:
                      failed.append({'category': category, 'feed': url, 'error': str(exc)})
              collected.sort(key=lambda x: x['date'], reverse=True)
              count = 0
              for item in collected:
                  if item['link'] in seen_links:
                      continue
                  seen_links.add(item['link'])
                  if not item['summary'] or len(item['summary']) < 50:
                      item['summary'] = item['title']
                  base_slug = slugify(item['title'])
                  date_part = item['date'].strftime('%Y%m%d')
                  link_hash = hashlib.sha1(item['link'].encode('utf-8')).hexdigest()[:8]
                  slug = f"{base_slug}_{date_part}_{link_hash}"
                  data = {
                      'review_status': 'published',
                      'title': item['title'],
                      'slug': slug,
                      'date': item['date'].strftime('%d.%m.%Y'),
                      'date_iso': item['date'].date().isoformat(),
                      'language': 'Turkish',
                      'country': 'Turkey' if category in {'Son Dakika','Gündem','Siyaset','Ekonomi','Sağlık'} else 'Global',
                      'category': category if category != 'Son Dakika' else 'Gündem',
                      'topic': category,
                      'spot': item['summary'],
                      'summary': item['summary'],
                      'source_url': item['link'],
                      'source_name': 'TRT Haber' if 'trthaber.com' in item['link'] or 'trthaber.com' in ''.join(urls) else 'YouTube / Nartanesi Haber',
                      'image_url': item.get('image') or '',
                      'indexed_on_home': True,
                      'quality_score': 72,
                      'quality_flags': [],
                      'fact_guard': {'source_url_required': True, 'source_outside_claims_forbidden': True},
                      'schema_version': 3,
                      'generator': 'generate-category-news-10x10',
                  }
                  Path('articles').mkdir(exist_ok=True)
                  Path(f'articles/{slug}.json').write_text(json.dumps(data, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
                  Path(f'articles/{slug}.html').write_text(build_html_article(data), encoding='utf-8')
                  generated.append({'category': category, 'slug': slug, 'title': item['title'], 'source': item['link']})
                  count += 1
                  if count >= 10:
                      break

          report_dir = Path('newsroom/generated')
          report_dir.mkdir(parents=True, exist_ok=True)
          report = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'target': '10 categories x 10 sourced items',
              'generated_count': len(generated),
              'generated': generated,
              'failed_feeds': failed,
          }
          report_dir.joinpath('category-news-10x10-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('generated_count', len(generated))
          for row in generated[:20]:
              print(row['category'], row['title'])
          if failed:
              print('failed_feeds', len(failed))
              for row in failed:
                  print(row)
          PY
      - name: Commit generated category news
        run: |
          git config user.name "Category News Generator"
          git config user.email "category-news-generator@users.noreply.github.com"
          git add articles newsroom/generated/category-news-10x10-report.json
          if git diff --staged --quiet; then
            echo "No generated news to commit."
            exit 0
          fi
          git commit -m "Generate sourced category news 10x10"
          git push
