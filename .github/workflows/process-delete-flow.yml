name: Process CMS Article Deletes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-delete-flow:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process CMS article deletes
        run: python tools/process_delete_flow.py --before "${{ github.event.before }}" --head "${{ github.sha }}"

      - name: Commit article delete cleanup
        run: |
          git config user.name "Delete Cleanup Bot"
          git config user.email "delete-cleanup@mansetradar.com.tr"
          git add articles news nachrichten data
          git diff --staged --quiet || (git commit -m "Clean deleted CMS article outputs" && git push)
