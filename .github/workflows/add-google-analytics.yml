name: Add Google Analytics GA4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.html'

jobs:
  add-ga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add GA4 Code
        run: |
          find . -name "*.html" -type f | while read file; do
            if ! grep -q "G-4WP1H2EJ6F" "$file"; then
              sed -i '/<head>/a\
  <!-- Google tag (gtag.js) -->\
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4WP1H2EJ6F"></script>\
  <script>\
    window.dataLayer = window.dataLayer || [];\
    function gtag(){dataLayer.push(arguments);}\
    gtag('\''js'\'', new Date());\
    gtag('\''config'\'', '\''G-4WP1H2EJ6F'\'');\
  </script>' "$file"
              echo "GA eklendi: $file"
            fi
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: Add GA4 to HTML files" || echo "No change"
          git push
