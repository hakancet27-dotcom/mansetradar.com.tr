name: TEMP Fix ManşetRadar Brand Live

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-live-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Replace old brand in live site files
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "NARTANESi": "ManşetRadar",
              "NARTANESİ": "ManşetRadar",
              "Nartanesi": "ManşetRadar",
              "nartanesi": "ManşetRadar",
          }
          suffixes = {".html", ".htm", ".json", ".xml", ".txt", ".js", ".css"}
          changed = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              if ".git" in path.parts:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = content
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != content:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          print(f"Degisen canli site dosyasi: {len(changed)}")
          for item in changed[:100]:
              print(item)
          PY

          git config user.name "Haber Botu"
          git config user.email "bot@mansetradar.com.tr"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "ManşetRadar marka adi guncellendi"
            git pull --rebase
            git push
          else
            echo "Commitlenecek canli site degisikligi yok."
          fi
