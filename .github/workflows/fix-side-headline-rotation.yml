name: Fix Side Headline Rotation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-side-headline-rotation
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Patch topic page side headline rotation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/topic-page-ux.js')
          if not path.exists():
              raise SystemExit('assets/js/topic-page-ux.js bulunamadi')

          text = path.read_text(encoding='utf-8')
          original = text

          sentinel = 'function refreshCategorySideHeadlineRotation()'
          var_anchor = "  var categoryFeedCache = {};\n  var categorySliderTimer = null;\n"
          func_anchor = "\n  async function loadCategoryArticles(topic) {"

          rotation_block = r'''
  function ensureCategorySideHeadlineRotationStyles() {
    if (document.getElementById('category-side-headline-rotation-style')) return;
    var style = document.createElement('style');
    style.id = 'category-side-headline-rotation-style';
    style.textContent = '.side-headline.is-side-rotated-out{display:none!important;}';
    document.head.appendChild(style);
  }

  function stopCategorySideHeadlineRotation() {
    if (sideHeadlineRotationTimer) {
      window.clearInterval(sideHeadlineRotationTimer);
      sideHeadlineRotationTimer = null;
    }
  }

  function setCategorySideHeadlinePage(cards, pageIndex) {
    var start = pageIndex * 2;
    var end = start + 2;
    cards.forEach(function (card, index) {
      var visible = index >= start && index < end;
      card.classList.toggle('is-side-rotated-out', !visible);
      card.setAttribute('aria-hidden', visible ? 'false' : 'true');
    });
  }

  function refreshCategorySideHeadlineRotation() {
    stopCategorySideHeadlineRotation();
    var rail = document.querySelector('.side-headlines');
    if (!rail) return;

    var cards = Array.prototype.slice.call(rail.querySelectorAll('.side-headline'));
    cards.forEach(function (card) {
      card.classList.remove('is-side-rotated-out');
      card.removeAttribute('aria-hidden');
    });

    if (selectedTopic() === 'son-dakika' || cards.length <= 2) return;

    ensureCategorySideHeadlineRotationStyles();
    var pageCount = Math.ceil(cards.length / 2);
    var pageIndex = 0;
    setCategorySideHeadlinePage(cards, pageIndex);

    sideHeadlineRotationTimer = window.setInterval(function () {
      pageIndex = (pageIndex + 1) % pageCount;
      setCategorySideHeadlinePage(cards, pageIndex);
    }, 4000);
  }

  window.refreshSideHeadlineRotation = refreshCategorySideHeadlineRotation;
'''

          if sentinel not in text:
              if var_anchor not in text:
                  raise SystemExit('Degisken yerlesim noktasi bulunamadi; dosya degismedi')
              text = text.replace(var_anchor, var_anchor + "  var sideHeadlineRotationTimer = null;\n", 1)

              if func_anchor not in text:
                  raise SystemExit('Fonksiyon yerlesim noktasi bulunamadi; dosya degismedi')
              text = text.replace(func_anchor, '\n' + rotation_block + func_anchor, 1)
          else:
              print('Rotasyon blogu zaten var; tekrar eklenmedi')

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('topic-page-ux.js hedefli rotasyon blogu ile guncellendi')
          else:
              print('Degisiklik yok')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/topic-page-ux.js
          git diff --check

      - name: Commit patch if changed
        run: |
          if git diff --quiet -- assets/js/topic-page-ux.js; then
            echo "Degisiklik yok; commit atlanıyor."
            exit 0
          fi
          git config user.name "ManşetRadar Fix Bot"
          git config user.email "bot@mansetradar.com.tr"
          git add assets/js/topic-page-ux.js
          git commit -m "Fix category side headline rotation"
          git push
