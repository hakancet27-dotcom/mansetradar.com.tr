name: Normalize News Images WebP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/normalize-news-images-webp.yml'
      - 'tools/cms_media_webp_normalize.py'

permissions:
  contents: write

concurrency:
  group: normalize-news-images-webp
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert local news images to WebP
        run: |
          python tools/cms_media_webp_normalize.py
          python tools/export_cms_published.py

      - name: Commit WebP normalized images
        run: |
          git config user.name "News Image Normalizer"
          git config user.email "images@mansetradar.com.tr"
          git add articles news nachrichten cms-published cms-stock-images
          if git diff --staged --quiet; then
            echo "WebP donusumu icin commitlenecek degisiklik yok."
          else
            git commit -m "Normalize news images to WebP"
            git push
          fi
