name: Process CMS Restore Requests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cms-restore-requests/**'
      - 'tools/process_restore_requests.py'

permissions:
  contents: write

jobs:
  process-restore-requests:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process restore requests
        run: python tools/process_restore_requests.py

      - name: Commit restore updates
        run: |
          git config user.name "Restore Request Bot"
          git config user.email "restore-request@mansetradar.com.tr"
          git add articles news nachrichten cms-delete-flow cms-restore-requests
          git diff --staged --quiet || (git commit -m "Process CMS restore requests" && git push)
