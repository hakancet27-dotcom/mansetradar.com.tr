name: Trigger Private Newsroom

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cms-workflow-requests/**'

permissions:
  contents: read

concurrency:
  group: trigger-private-newsroom
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger haber-botu newsroom workflow
        env:
          HABER_BOTU_WORKFLOW_TOKEN: ${{ secrets.HABER_BOTU_WORKFLOW_TOKEN }}
        run: |
          if [ -z "${HABER_BOTU_WORKFLOW_TOKEN}" ]; then
            echo "HABER_BOTU_WORKFLOW_TOKEN secret eksik. Public repoya repo/actions yetkili PAT secret eklenmeli."
            exit 1
          fi

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${HABER_BOTU_WORKFLOW_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hakancet27-dotcom/haber-botu/actions/workflows/newsroom.yml/dispatches \
            -d '{"ref":"main","inputs":{"rebuild_member_features":"false"}}'

          echo "haber-botu newsroom workflow dispatch istegi gonderildi."
