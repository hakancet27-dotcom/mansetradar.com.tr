name: Complete Category News 10x10

# EKSİK KATEGORİ HABERLERİNİ TAMAMLAMA WORKFLOW'U
#
# Ne yapar?
# - Public site içinde bazı kategorilerde hedef haber sayısını tamamlamaya çalışır.
# - RSS kaynaklarından haber bilgisi alıp eksik kategori makaleleri oluşturabilir.
# - JSON/HTML haber dosyaları ve üretim raporu yazabilir.
# - Değişiklik varsa public site reposuna commit/push yapabilir.
#
# Ne zaman çalışır?
# - Otomatik çalışmaz.
# - Yalnızca GitHub Actions ekranından bilinçli olarak manuel başlatılmalıdır.
#
# Yetki ve risk notu:
# - `contents: write` yetkisine sahiptir.
# - Geniş arşive dokunma riski nedeniyle çalıştırmadan önce hangi kategori eksiğinin
#   kapatılacağı net olmalıdır.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete missing category news
        run: |
          python - <<'PY'
          import email.utils, hashlib, html, json, re, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          TARGET = 10
          FEEDS = {
            'Dünya': ['https://www.trthaber.com/dunya_articles.rss'],
            'Spor': ['https://www.trthaber.com/spor_articles.rss'],
            'Magazin': ['https://www.trthaber.com/magazin_articles.rss','https://www.trthaber.com/kultur-sanat_articles.rss'],
            'Teknoloji': ['https://www.trthaber.com/bilim-teknoloji_articles.rss'],
            'Sağlık': ['https://www.trthaber.com/saglik_articles.rss'],
            'Video': ['https://www.trthaber.com/video_articles.rss','https://www.trthaber.com/gundem_articles.rss'],
          }
          ALL_CATS = ['Son Dakika','Gündem','Siyaset','Ekonomi','Dünya','Spor','Magazin','Teknoloji','Sağlık','Video']

          def clean(v):
            v = html.unescape(v or '')
            v = re.sub(r'<[^>]+>', ' ', v)
            return re.sub(r'\s+', ' ', v).strip()
          def slugify(v):
            table=str.maketrans('çğıöşüÇĞİÖŞÜ','cgiosuCGIOSU')
            v=(v or '').translate(table).lower()
            return re.sub(r'[^a-z0-9]+','-',v).strip('-')[:82] or 'haber'
          def dt(v):
            try:
              d=email.utils.parsedate_to_datetime(v or '')
              if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
              return d.astimezone(timezone.utc)
            except Exception:
              return datetime.now(timezone.utc)
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'hakancetin-category-completer/1.0'})
            with urllib.request.urlopen(req,timeout=25) as r: return r.read()
          def parse(raw):
            root=ET.fromstring(raw); rows=[]
            for item in root.findall('.//item'):
              title=clean(item.findtext('title')); link=clean(item.findtext('link')); desc=clean(item.findtext('description'))
              pub=item.findtext('pubDate') or ''
              image=''; enc=item.find('enclosure')
              if enc is not None: image=enc.attrib.get('url','')
              if title and link: rows.append({'title':title,'link':link,'summary':desc or title,'date':dt(pub),'image':image})
            return rows
          def article_html(data):
            title=html.escape(data['title']); summary=html.escape(data['summary']); cat=html.escape(data['category']); url=html.escape(data['source_url']); slug=data['slug']
            return f'''<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{summary[:155]}"><link rel="canonical" href="https://mansetradar.com.tr/articles/{slug}/"><title>{title} | mansetradar.com.tr</title><style>body{{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#222;line-height:1.7}}header,main{{max-width:900px;margin:auto}}header{{padding:18px}}main{{background:#fff;margin-top:20px;padding:28px;border-radius:10px}}.cat{{color:#e10600;font-weight:700}}.spot{{font-size:1.1rem;border-left:5px solid #e10600;padding-left:14px}}</style></head><body><header><a href="/haber/">← Haberler</a></header><main><div class="cat">{cat}</div><h1>{title}</h1><p class="spot">{summary}</p><p>Bu haber, kaynak akışından alınan doğrulanabilir bilgilerle hazırlanmış yayın kaydıdır.</p><p><strong>Kaynak:</strong> <a href="{url}" rel="nofollow noopener" target="_blank">Kaynak haberi oku</a></p></main></body></html>'''

          existing=[]
          for p in Path('articles').glob('*.json'):
            try:
              d=json.loads(p.read_text(encoding='utf-8')); existing.append(d)
            except Exception: pass
          counts={c:0 for c in ALL_CATS}; links=set(); titles=set()
          for d in existing:
            c=d.get('topic') or d.get('category')
            if c in counts: counts[c]+=1
            if d.get('source_url'): links.add(d['source_url'])
            if d.get('title'): titles.add(d['title'])
          generated=[]; errors=[]
          for cat, feeds in FEEDS.items():
            need=max(0,TARGET-counts.get(cat,0))
            if need<=0: continue
            pool=[]
            for f in feeds:
              try: pool += parse(fetch(f))
              except Exception as e: errors.append({'category':cat,'feed':f,'error':str(e)})
            pool.sort(key=lambda x:x['date'], reverse=True)
            for item in pool:
              if need<=0: break
              if item['link'] in links or item['title'] in titles: continue
              h=hashlib.sha1(item['link'].encode()).hexdigest()[:8]
              slug=f"{slugify(item['title'])}_{item['date'].strftime('%Y%m%d')}_{h}"
              data={'review_status':'published','title':item['title'],'slug':slug,'date':item['date'].strftime('%d.%m.%Y'),'date_iso':item['date'].date().isoformat(),'language':'Turkish','country':'Turkey' if cat!='Dünya' else 'Global','category':cat,'topic':cat,'spot':item['summary'],'summary':item['summary'],'source_url':item['link'],'source_name':'TRT Haber','image_url':item.get('image',''),'indexed_on_home':True,'quality_score':72,'quality_flags':[],'schema_version':3,'generator':'complete-category-news-10x10'}
              Path('articles').mkdir(exist_ok=True)
              Path(f'articles/{slug}.json').write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
              Path(f'articles/{slug}.html').write_text(article_html(data),encoding='utf-8')
              generated.append({'category':cat,'slug':slug,'title':item['title'],'source':item['link']})
              links.add(item['link']); titles.add(item['title']); need-=1; counts[cat]=counts.get(cat,0)+1
          Path('newsroom/generated').mkdir(parents=True, exist_ok=True)
          report={'generated_at':datetime.now(timezone.utc).isoformat(),'generated_count':len(generated),'category_counts':counts,'generated':generated,'errors':errors}
          Path('newsroom/generated/category-news-10x10-completion-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('generated_count', len(generated)); print('category_counts', counts); print('errors', len(errors))
          PY
      - name: Commit completed news
        run: |
          git config user.name "Category News Completer"
          git config user.email "category-news-completer@users.noreply.github.com"
          git add articles newsroom/generated/category-news-10x10-completion-report.json
          if git diff --staged --quiet; then
            echo "No missing category news to commit."
            exit 0
          fi
          git commit -m "Complete category news 10x10"
          git push
