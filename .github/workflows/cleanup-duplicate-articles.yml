name: Cleanup Duplicate Articles

on:
  push:
    paths:
      - '.github/workflows/cleanup-duplicate-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-duplicate-articles
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Remove lower-quality duplicate article copies
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import shutil
          from pathlib import Path

          TARGET_SLUGS = {
              'daha-17-de-buyuk-gizem-kolyenin-sirri-ortaya-cikiyor_20260605',
              'abd-de-bombali-soygun-girisimi-fbi-alarma-gecti_20260603',
              'nba-europe-ekim-2027-basliyor-tarihi-yatirim_20260603',
              'aym-den-suresiz-nafakaya-iptal-meclise-9-ay-sure-3-yeni-model-gundemde_20260605',
          }

          KEEP_SLUGS = {
              'daha-17-kolyenin-sirri-hakanin-ofkesi-ve-abisinin-gizemi_20260605',
              'abd-california-bakersfield-banka-soygunu-rehine-krizi-fbi_20260603',
              'nba-avrupa-ligi-projesi-ekim-2027-mark-tatum-aciklamasi_20260603',
              'aym-suresiz-nafaka-iptal-yeni-donem_20260605',
          }

          TEXT_SUFFIXES = {'.json', '.xml', '.html', '.txt'}
          root = Path('.')
          removed_paths = []
          updated_json = []
          updated_text = []

          def mentions_target(value) -> bool:
              if not isinstance(value, str):
                  return False
              return any(slug in value for slug in TARGET_SLUGS)

          def should_drop_dict(obj: dict) -> bool:
              keys = ('slug', 'id', 'url', 'canonical_url', 'detail_json_url', 'image_url')
              return any(mentions_target(obj.get(key)) for key in keys)

          def prune(value):
              if isinstance(value, list):
                  changed = False
                  new_items = []
                  for item in value:
                      if isinstance(item, dict) and should_drop_dict(item):
                          changed = True
                          continue
                      pruned, item_changed = prune(item)
                      changed = changed or item_changed
                      new_items.append(pruned)
                  return new_items, changed
              if isinstance(value, dict):
                  if should_drop_dict(value):
                      return None, True
                  changed = False
                  new_obj = {}
                  for key, item in value.items():
                      pruned, item_changed = prune(item)
                      changed = changed or item_changed
                      new_obj[key] = pruned
                  if isinstance(new_obj.get('meta'), dict):
                      meta = new_obj['meta']
                      if isinstance(new_obj.get('articles'), list):
                          meta['article_count'] = len(new_obj['articles'])
                          changed = True
                      if isinstance(new_obj.get('items'), list):
                          meta['article_count'] = len(new_obj['items'])
                          changed = True
                  return new_obj, changed
              return value, False

          def remove_xml_url_blocks(text: str) -> tuple[str, bool]:
              original = text
              for slug in TARGET_SLUGS:
                  text = re.sub(r'\n?\s*<url>.*?' + re.escape(slug) + r'.*?</url>', '', text, flags=re.S)
              return text, text != original

          def scrub_loose_text(text: str) -> tuple[str, bool]:
              if not any(slug in text for slug in TARGET_SLUGS):
                  return text, False
              lines = text.splitlines()
              filtered = [line for line in lines if not any(slug in line for slug in TARGET_SLUGS)]
              return '\n'.join(filtered) + ('\n' if text.endswith('\n') else ''), filtered != lines

          for slug in TARGET_SLUGS:
              article_dir = root / 'articles' / slug
              if article_dir.exists():
                  shutil.rmtree(article_dir)
                  removed_paths.append(str(article_dir) + '/')

              detail = root / 'data' / 'details' / 'articles' / f'{slug}.json'
              if detail.exists():
                  detail.unlink()
                  removed_paths.append(str(detail))

              for image in (root / 'articles' / 'images').glob(f'{slug}.*'):
                  image.unlink()
                  removed_paths.append(str(image))

          for path in sorted((root / 'data').rglob('*.json')):
              try:
                  data = json.loads(path.read_text(encoding='utf-8-sig'))
              except Exception as exc:
                  raise SystemExit(f'JSON okunamadi: {path}: {exc}')
              pruned, changed = prune(data)
              if changed:
                  path.write_text(json.dumps(pruned, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  updated_json.append(str(path))

          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in TEXT_SUFFIXES:
                  continue
              if str(path).startswith('.git/'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if path.suffix.lower() == '.xml':
                  new_text, changed = remove_xml_url_blocks(text)
              elif path.suffix.lower() in {'.txt'}:
                  new_text, changed = scrub_loose_text(text)
              else:
                  continue
              if changed:
                  path.write_text(new_text, encoding='utf-8')
                  updated_text.append(str(path))

          print('Kalacak kaliteli haberler:')
          for slug in sorted(KEEP_SLUGS):
              print('  KEEP', slug)
          print('Silinen/kaldirilan kopyalar:')
          for slug in sorted(TARGET_SLUGS):
              print('  REMOVE', slug)
          print('Silinen dosya/klasor sayisi:', len(removed_paths))
          for p in removed_paths:
              print('  deleted', p)
          print('Guncellenen JSON sayisi:', len(updated_json))
          for p in updated_json[:120]:
              print('  json', p)
          print('Guncellenen XML/TXT sayisi:', len(updated_text))
          for p in updated_text:
              print('  text', p)

          search_index = root / 'data' / 'search-index.json'
          search_text = search_index.read_text(encoding='utf-8') if search_index.exists() else ''
          missing_keep = [slug for slug in KEEP_SLUGS if slug not in search_text]
          if missing_keep:
              raise SystemExit('Kalacak kaliteli haber arama indeksinden kayboldu: ' + ', '.join(missing_keep))

          remaining = []
          for path in [root / 'data' / 'articles.json', root / 'data' / 'search-index.json', root / 'sitemap.xml', root / 'news-sitemap.xml']:
              if path.exists():
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  for slug in TARGET_SLUGS:
                      if slug in text:
                          remaining.append(f'{path}:{slug}')
          if remaining:
              raise SystemExit('Kopya slug referansi temizlenemedi: ' + '; '.join(remaining))
          PY

      - name: Validate cleanup
        run: |
          python -m json.tool data/articles.json >/dev/null
          python -m json.tool data/search-index.json >/dev/null
          for slug in \
            daha-17-de-buyuk-gizem-kolyenin-sirri-ortaya-cikiyor_20260605 \
            abd-de-bombali-soygun-girisimi-fbi-alarma-gecti_20260603 \
            nba-europe-ekim-2027-basliyor-tarihi-yatirim_20260603 \
            aym-den-suresiz-nafakaya-iptal-meclise-9-ay-sure-3-yeni-model-gundemde_20260605; do
            if grep -R "$slug" data sitemap.xml news-sitemap.xml articles 2>/dev/null; then
              echo "Temizlenmeyen kopya slug bulundu: $slug"
              exit 1
            fi
          done
          for slug in \
            daha-17-kolyenin-sirri-hakanin-ofkesi-ve-abisinin-gizemi_20260605 \
            abd-california-bakersfield-banka-soygunu-rehine-krizi-fbi_20260603 \
            nba-avrupa-ligi-projesi-ekim-2027-mark-tatum-aciklamasi_20260603 \
            aym-suresiz-nafaka-iptal-yeni-donem_20260605; do
            grep -R "$slug" data/search-index.json >/dev/null
          done
          git diff --check

      - name: Commit cleanup
        run: |
          git rm --ignore-unmatch .github/workflows/cleanup-duplicate-articles.yml
          if git diff --quiet; then
            echo "Degisiklik yok; commit atlanıyor."
            exit 0
          fi
          git config user.name "ManşetRadar Cleanup Bot"
          git config user.email "bot@mansetradar.com.tr"
          git add -A
          git commit -m "Remove lower-quality duplicate articles"
          git push
