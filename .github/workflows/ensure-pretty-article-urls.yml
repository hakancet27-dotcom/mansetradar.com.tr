name: Ensure Pretty Article URLs

# PUBLIC SITE PRETTY URL GARANTI WORKFLOW'U
#
# Ne yapar?
# - articles altindaki slug.html dosyalarini tarar.
# - Her slug.html icin slug/index.html yoksa ayni HTML icerigiyle olusturur.
# - Boylece /articles/YYYY/MM/slug/ adresleri 404 vermez.
# - Haber icerigini degistirmez; yalniz eksik pretty URL kopyasini tamamlar.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'articles/**/*.html'

permissions:
  contents: write

concurrency:
  group: ensure-pretty-article-urls
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create missing pretty article URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roots = [Path("articles"), Path("news/articles"), Path("nachrichten/artikel")]
          created = []

          for root in roots:
              if not root.exists():
                  continue
              for html_path in sorted(root.rglob("*.html")):
                  if html_path.name == "index.html":
                      continue
                  # images/review gibi yardimci klasorleri atla
                  if any(part in {"images", "review", "pending", "duplicates", "archive"} for part in html_path.parts):
                      continue
                  pretty_dir = html_path.with_suffix("")
                  pretty_path = pretty_dir / "index.html"
                  if pretty_path.exists():
                      continue
                  pretty_dir.mkdir(parents=True, exist_ok=True)
                  pretty_path.write_text(html_path.read_text(encoding="utf-8-sig"), encoding="utf-8")
                  created.append(str(pretty_path))

          if created:
              print("Olusturulan pretty URL dosyalari:")
              for item in created:
                  print(f"- {item}")
          else:
              print("Eksik pretty URL dosyasi yok.")
          PY

      - name: Commit missing pretty URLs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- articles news nachrichten; then
            echo "Commit edilecek pretty URL degisikligi yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles news nachrichten
          git commit -m "Ensure pretty article URLs"
          git pull --rebase
          git push
