name: Update sidebar data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron UTC çalışır. Türkiye saati 00:01 için UTC 21:01 kullanılır.
    - cron: '1 21 * * *'

permissions:
  contents: write

jobs:
  update-sidebar-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate horoscope and legacy sidebar JSON files
        env:
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
        run: node scripts/update-sidebar-data.mjs

      - name: Generate real football standings with API-FOOTBALL
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          FOOTBALL_SEASON: '2025'
        run: node scripts/update-standings-data.mjs

      - name: Commit updated sidebar data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update sidebar live data
          file_pattern: data/horoscope.json data/standings.json
