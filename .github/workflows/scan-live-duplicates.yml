name: Scan Live Duplicate Articles

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scan-live-duplicates.yml'

permissions:
  contents: write

concurrency:
  group: scan-live-duplicates
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Scan same-day duplicate candidates
        run: |
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import re
          import unicodedata
          from collections import defaultdict
          from dataclasses import dataclass
          from difflib import SequenceMatcher
          from pathlib import Path

          ROOT = Path('.')
          ARTICLES_JSON = ROOT / 'data' / 'articles.json'
          REPORT = ROOT / 'newsroom' / 'reports' / 'live-duplicate-scan.md'

          STOPWORDS = {
              've','veya','ile','bir','bu','şu','su','da','de','için','icin','olan','oldu','olacak','son','yeni',
              'haber','haberi','haberleri','gündem','gundem','son dakika','sondakika','türkiye','turkiye','spor',
              'siyaset','ekonomi','dünya','dunya','teknoloji','sağlık','saglik','magazin','video','güncel','guncel',
              'başlıyor','basliyor','açıklandı','aciklandi','dedi','etti','sonrası','sonrasi','karşı','karsi',
              'the','and','for','with','from','that','this','news','der','die','das','und','mit','von','für','fur'
          }

          def clean(value):
              text = html.unescape(str(value or ''))
              text = re.sub(r'<[^>]+>', ' ', text)
              return re.sub(r'\s+', ' ', text).strip()

          def norm(value):
              text = clean(value).lower().translate(str.maketrans({'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u'}))
              text = unicodedata.normalize('NFKD', text)
              text = ''.join(ch for ch in text if not unicodedata.combining(ch))
              text = re.sub(r'[^a-z0-9\s]', ' ', text)
              return re.sub(r'\s+', ' ', text).strip()

          def tokens(value):
              result = []
              for token in norm(value).split():
                  if len(token) < 3 or token in STOPWORDS:
                      continue
                  result.append(token)
              return set(result)

          def fingerprint(title):
              toks = [t for t in norm(title).split() if len(t) >= 4 and t not in STOPWORDS]
              return ' '.join(toks[:8])

          def source_key(url):
              text = clean(url).lower().strip().rstrip('/')
              text = re.sub(r'[?&#].*$', '', text)
              return text

          def article_text(item):
              parts = [item.get('title',''), item.get('summary',''), item.get('source_name',''), ' '.join(item.get('tags') or [])]
              return ' '.join(clean(p) for p in parts if p)

          def ratio(a, b):
              return SequenceMatcher(None, norm(a), norm(b)).ratio()

          def similarity(left, right):
              lt = tokens(article_text(left))
              rt = tokens(article_text(right))
              common = lt & rt
              union = lt | rt
              min_size = max(1, min(len(lt), len(rt)))
              return {
                  'title_ratio': ratio(left.get('title',''), right.get('title','')),
                  'containment': len(common) / min_size,
                  'jaccard': len(common) / max(1, len(union)),
                  'common': sorted(common),
              }

          def decide(left, right):
              reasons = []
              lk = source_key(left.get('source_url'))
              rk = source_key(right.get('source_url'))
              if lk and lk == rk:
                  reasons.append('same_source_url')

              lf = fingerprint(left.get('title'))
              rf = fingerprint(right.get('title'))
              sim = similarity(left, right)
              if lf and lf == rf and sim['title_ratio'] >= 0.72:
                  reasons.append('same_title_fingerprint')
              if sim['title_ratio'] >= 0.82 and sim['containment'] >= 0.42 and len(sim['common']) >= 6:
                  reasons.append('high_title_similarity')
              if sim['containment'] >= 0.58 and sim['jaccard'] >= 0.24 and len(sim['common']) >= 10:
                  reasons.append('high_text_overlap')

              duplicate = bool(reasons)
              confidence = 'high' if ('same_source_url' in reasons or len(reasons) >= 2) else ('medium' if duplicate else 'low')
              return duplicate, confidence, reasons, sim

          def keep_score(item):
              # Higher score is safer to keep: quality, local image, article section, source specificity.
              return (
                  int(item.get('quality_score') or 0),
                  1 if clean(item.get('image_url')).startswith('https://mansetradar.com.tr/') else 0,
                  1 if item.get('section') == 'articles' else 0,
                  len(clean(item.get('summary'))),
                  clean(item.get('slug')),
              )

          if not ARTICLES_JSON.exists():
              raise SystemExit('data/articles.json bulunamadi')

          payload = json.loads(ARTICLES_JSON.read_text(encoding='utf-8-sig'))
          articles = payload.get('articles') or []

          groups = defaultdict(list)
          for item in articles:
              date = clean(item.get('date_iso') or item.get('date'))
              if date:
                  groups[date].append(item)

          candidates = []
          for date, items in groups.items():
              for i, left in enumerate(items):
                  for right in items[i+1:]:
                      # Only same language/section or exact source-url cross-section pairs.
                      same_scope = left.get('section') == right.get('section') and left.get('language') == right.get('language')
                      same_source = source_key(left.get('source_url')) and source_key(left.get('source_url')) == source_key(right.get('source_url'))
                      if not same_scope and not same_source:
                          continue
                      duplicate, confidence, reasons, sim = decide(left, right)
                      if not duplicate:
                          continue
                      keep, review = (left, right) if keep_score(left) >= keep_score(right) else (right, left)
                      candidates.append({
                          'date': date,
                          'confidence': confidence,
                          'reasons': reasons,
                          'title_ratio': sim['title_ratio'],
                          'containment': sim['containment'],
                          'jaccard': sim['jaccard'],
                          'common': sim['common'][:24],
                          'keep': keep,
                          'review': review,
                      })

          # De-duplicate candidate graph by loser slug/source pair.
          unique = []
          seen = set()
          for c in sorted(candidates, key=lambda x: (x['date'], x['confidence'], x['title_ratio'], x['containment']), reverse=True):
              key = tuple(sorted([clean(c['keep'].get('slug')), clean(c['review'].get('slug'))]))
              if key in seen:
                  continue
              seen.add(key)
              unique.append(c)

          high = [c for c in unique if c['confidence'] == 'high']
          medium = [c for c in unique if c['confidence'] == 'medium']

          def row(item):
              keep = item['keep']
              review = item['review']
              return (
                  f"| {item['date']} | {item['confidence']} | "
                  f"`{clean(keep.get('slug'))}` | `{clean(review.get('slug'))}` | "
                  f"{item['title_ratio']:.3f} | {item['containment']:.3f} | {item['jaccard']:.3f} | "
                  f"{', '.join(item['reasons'])} |"
              )

          lines = [
              '# Live Same-Day Duplicate Scan',
              '',
              'Bu rapor canlı site deposundaki `data/articles.json` üzerinden üretildi. Hiçbir haber silinmedi veya taşınmadı.',
              '',
              f'- Toplam canlı kayıt: {len(articles)}',
              f'- Aynı gün duplicate adayı: {len(unique)}',
              f'- Yüksek güven: {len(high)}',
              f'- Orta güven: {len(medium)}',
              '',
              '## Silme/karantina önerisi gerektiren adaylar',
              '',
          ]
          if not unique:
              lines.append('Aynı gün için güçlü duplicate adayı bulunmadı.')
          else:
              lines.extend([
                  '| Tarih | Güven | Kalması önerilen | İncelenecek/olası kaldırılacak | Başlık | Metin örtüşme | Jaccard | Sebep |',
                  '|---|---:|---|---|---:|---:|---:|---|',
              ])
              for item in unique[:80]:
                  lines.append(row(item))

          if unique:
              lines.extend(['', '## Ayrıntılar', ''])
              for idx, item in enumerate(unique[:40], 1):
                  keep = item['keep']
                  review = item['review']
                  lines.extend([
                      f"### {idx}. {item['date']} / {item['confidence']}",
                      f"- Kalması önerilen: [{clean(keep.get('title'))}]({clean(keep.get('url'))})",
                      f"  - slug: `{clean(keep.get('slug'))}`",
                      f"  - kaynak: {clean(keep.get('source_name'))} / {clean(keep.get('source_url'))}",
                      f"  - kategori: {clean(keep.get('category'))}, kalite: {keep.get('quality_score')}",
                      f"- İncelenecek: [{clean(review.get('title'))}]({clean(review.get('url'))})",
                      f"  - slug: `{clean(review.get('slug'))}`",
                      f"  - kaynak: {clean(review.get('source_name'))} / {clean(review.get('source_url'))}",
                      f"  - kategori: {clean(review.get('category'))}, kalite: {review.get('quality_score')}",
                      f"- skorlar: title={item['title_ratio']:.3f}, containment={item['containment']:.3f}, jaccard={item['jaccard']:.3f}",
                      f"- ortak terimler: {', '.join(item['common']) or '-'}",
                      '',
                  ])

          REPORT.parent.mkdir(parents=True, exist_ok=True)
          REPORT.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines[:120]))
          print(f'Rapor yazildi: {REPORT}')
          PY

      - name: Commit report
        run: |
          if git diff --quiet -- newsroom/reports/live-duplicate-scan.md; then
            echo "Rapor değişmedi; commit atlanıyor."
            exit 0
          fi
          git config user.name "ManşetRadar Audit Bot"
          git config user.email "bot@mansetradar.com.tr"
          git add newsroom/reports/live-duplicate-scan.md
          git commit -m "Report live same-day duplicate candidates"
          git push
