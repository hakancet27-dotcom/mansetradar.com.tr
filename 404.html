  <title>Sayfa bulunamadı | mansetradar.com.tr</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#111827;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:640px;background:white;border:1px solid #e5e7eb;border-radius:14px;padding:28px;box-shadow:0 12px 40px rgba(15,23,42,.08)}
    h1{margin:0 0 10px;font-size:1.55rem}p{line-height:1.6;color:#4b5563}a{color:#e10600;font-weight:800;text-decoration:none}.muted{font-size:.9rem;color:#6b7280}
  </style>
  <script>
    (function () {
      var path = window.location.pathname || "/";
      var articleMatch = path.match(/^\/articles\/([^\/]+)\/?$/);
      var datedMatch = path.match(/^\/articles\/([^\/]*_(\d{4})(\d{2})\d{2}(?:_[^\/]*)?)\/?$/);

      if (datedMatch) {
        window.location.replace("/articles/" + datedMatch[2] + "/" + datedMatch[3] + "/" + datedMatch[1] + "/" + window.location.search + window.location.hash);
        return;
      }

      if (!articleMatch) return;
      var slug = articleMatch[1];

      function normalizeUrl(value) {
        if (!value || typeof value !== "string") return "";
        try {
          var url = new URL(value, window.location.origin);
          if (url.origin !== window.location.origin) return "";
          return url.pathname + window.location.search + window.location.hash;
        } catch (error) {
          return "";
        }
      }

      function findArticleUrl(payload) {
        var articles = [];
        if (Array.isArray(payload)) articles = payload;
        else if (payload && Array.isArray(payload.articles)) articles = payload.articles;
        else if (payload && Array.isArray(payload.items)) articles = payload.items;
        for (var i = 0; i < articles.length; i += 1) {
          var item = articles[i] || {};
          if (item.slug === slug) {
            return normalizeUrl(item.url || item.canonical_url || item.href);
          }
        }
        return "";
      }

      function lookup(index) {
        var files = ["/data/articles.json", "/data/search-index.json", "/data/home.json"];
        if (index >= files.length) return;
        fetch(files[index], {cache:"no-store"})
          .then(function (response) { return response.ok ? response.json() : null; })
          .then(function (payload) {
            var target = findArticleUrl(payload);
            if (target && target !== path) {
              window.location.replace(target);
              return;
            }
            lookup(index + 1);
          })
          .catch(function () { lookup(index + 1); });
      }

      lookup(0);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığınız haber yeni arşiv düzenine taşınmış olabilir. Bağlantı, haber indeksinde aranıyor ve bulunursa doğru adrese açılacak.</p>
    <p class="muted"><a href="/">Ana sayfaya dön</a></p>
  </main>
</body>
