<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Sayfa bulunamadı | mansetradar.com.tr</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#111827;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:640px;background:white;border:1px solid #e5e7eb;border-radius:14px;padding:28px;box-shadow:0 12px 40px rgba(15,23,42,.08)}
    h1{margin:0 0 10px;font-size:1.55rem}p{line-height:1.6;color:#4b5563}a{color:#e10600;font-weight:800;text-decoration:none}.muted{font-size:.9rem;color:#6b7280}
  </style>
  <script>
    (function () {
      var path = window.location.pathname || "/";
      var match = path.match(/^\/articles\/([^\/]+_(\d{4})(\d{2})\d{2})\/?$/);
      if (!match) return;
      var target = "/articles/" + match[2] + "/" + match[3] + "/" + match[1] + "/" + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığınız haber yeni arşiv düzenine taşınmış olabilir. Eski haber bağlantısı otomatik olarak yeni aylık haber yoluna yönlendirilmeye çalışılıyor.</p>
    <p class="muted"><a href="/">Ana sayfaya dön</a></p>
  </main>
</body>
</html>
