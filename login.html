          <span id="google-login-text">Google ile devam et</span>

      <!-- Tab Panel 2: Signup Form -->

  <script src="/assets/js/member-auth.js?v=20260530d"></script>
  <script src="/assets/js/login-page.js?v=20260605a"></script>

  <!-- Multilingual & Interactive Corporate Controller -->
  <script>
    (function() {
      'use strict';

      // 1. Tab Switching Controller
      const tabLoginBtn = document.getElementById('tab-login-btn');
      const tabSignupBtn = document.getElementById('tab-signup-btn');
      const loginPanel = document.getElementById('login-panel');
      const signupPanel = document.getElementById('signup-panel');

      function showLogin() {
        tabLoginBtn.classList.add('active');
        tabSignupBtn.classList.remove('active');
        loginPanel.style.display = 'block';
        signupPanel.style.display = 'none';
      }

      function showSignup() {
        tabSignupBtn.classList.add('active');
        tabLoginBtn.classList.remove('active');
        signupPanel.style.display = 'block';
        loginPanel.style.display = 'none';
      }

      tabLoginBtn.addEventListener('click', showLogin);
      tabSignupBtn.addEventListener('click', showSignup);

      // 2. Multilingual Content Dictionary (TR / DE / EN)
      const DICT = {
        tr: {
          title: "Üye Girişi | mansetradar.com.tr",
          homeHref: "/",
          backHome: "Ana sayfaya dön",
          heading: "Üye Girişi",
          desc: "Haberleri kaydetmek, yorum yapmak ve üyelik tercihlerinizi yönetmek için kurumsal portalınıza giriş yapın.",
          tabLogin: "Giriş Yap",
          tabSignup: "Yeni Üyelik",
          emailLabel: "E-posta Adresi",
          emailPlaceholder: "ornek@mail.com",
          passLabel: "Şifre",
          loginBtn: "Giriş Yap",
          forgotPass: "Şifremi unuttum",
          divider: "veya",
          googleBtn: "Google ile devam et",
          nameLabel: "Ad Soyad",
          namePlaceholder: "Adınız Soyadınız",
          signupPassPlaceholder: "En az 8 karakter",
          signupBtn: "Hesap Oluştur",
          actionHome: "Ana Sayfa",
          actionAccount: "Hesabıma Git",
          trust: "256-Bit SSL Güvenliği · Mansetradar Medya Grubu"
        },
        de: {
          title: "Mitglieder-Login | mansetradar.com.tr",
          homeHref: "/nachrichten/",
          backHome: "Zur Startseite",
          heading: "Mitglieder-Login",
          desc: "Melden Sie sich an, um Artikel zu speichern, Kommentare abzugeben und Benachrichtigungen zu verwalten.",
          tabLogin: "Anmelden",
          tabSignup: "Registrieren",
          emailLabel: "E-Mail-Adresse",
          emailPlaceholder: "beispiel@mail.com",
          passLabel: "Passwort",
          loginBtn: "Anmelden",
          forgotPass: "Passwort vergessen?",
          divider: "oder",
          googleBtn: "Mit Google fortfahren",
          nameLabel: "Vollständiger Name",
          namePlaceholder: "Vorname Nachname",
          signupPassPlaceholder: "Mindestens 8 Zeichen",
          signupBtn: "Konto erstellen",
          actionHome: "Zur Startseite",
          actionAccount: "Zum Benutzerkonto",
          trust: "256-Bit SSL Verschlüsselung · DSGVO-konform"
        },
        en: {
          title: "Member Login | mansetradar.com.tr",
          homeHref: "/news/",
          backHome: "Back to Home",
          heading: "Member Login",
          desc: "Sign in to save articles, participate in discussions, and manage your account settings.",
          tabLogin: "Sign In",
          tabSignup: "Register",
          emailLabel: "Email Address",
          emailPlaceholder: "name@example.com",
          passLabel: "Password",
          loginBtn: "Sign In",
          forgotPass: "Forgot password?",
          divider: "or",
          googleBtn: "Continue with Google",
          nameLabel: "Full Name",
          namePlaceholder: "First Last",
          signupPassPlaceholder: "At least 8 characters",
          signupBtn: "Create Account",
          actionHome: "Home",
          actionAccount: "My Account",
          trust: "256-Bit SSL Security · Mansetradar Media Group"
        }
      };

      function applyLanguage(lang) {
        lang = (lang || 'tr').toLowerCase();
        if (!DICT[lang]) lang = 'tr';

        const t = DICT[lang];
        document.documentElement.lang = lang;
        document.title = t.title;

        // Active state on pills
        document.querySelectorAll('.member-lang-switcher .lang-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.lang === lang);
        });

        // Brand & Back Links
        const brandLink = document.getElementById('brand-link');
        if (brandLink) brandLink.href = t.homeHref;

        const backLink = document.getElementById('back-home-link');
        const backText = document.getElementById('back-home-text');
        if (backLink) backLink.href = t.homeHref;
        if (backText) backText.textContent = t.backHome;

        // Header Title & Desc
        const titleEl = document.getElementById('auth-main-title');
        const descEl = document.getElementById('auth-main-desc');
        if (titleEl) titleEl.textContent = t.heading;
        if (descEl) descEl.textContent = t.desc;

        // Tabs
        tabLoginBtn.textContent = t.tabLogin;
        tabSignupBtn.textContent = t.tabSignup;

        // Login Form
        document.getElementById('label-login-email').textContent = t.emailLabel;
        document.getElementById('login-email').placeholder = t.emailPlaceholder;
        document.getElementById('label-login-password').textContent = t.passLabel;
        document.getElementById('forgot-password-link').textContent = t.forgotPass;
        document.getElementById('submit-login-btn').textContent = t.loginBtn;

        // Divider & Google
        document.getElementById('divider-text-1').textContent = t.divider;
        document.getElementById('google-login-text').textContent = t.googleBtn;

        // Signup Form
        document.getElementById('label-signup-name').textContent = t.nameLabel;
        document.getElementById('signup-name').placeholder = t.namePlaceholder;
        document.getElementById('label-signup-email').textContent = t.emailLabel;
        document.getElementById('signup-email').placeholder = t.emailPlaceholder;
        document.getElementById('label-signup-password').textContent = t.passLabel;
        document.getElementById('signup-password').placeholder = t.signupPassPlaceholder;
        document.getElementById('submit-signup-btn').textContent = t.signupBtn;

        // Footer Actions
        const actHome = document.getElementById('card-action-home');
        const actAcc = document.getElementById('card-action-account');
        if (actHome) { actHome.textContent = t.actionHome; actHome.href = t.homeHref; }
        if (actAcc) actAcc.textContent = t.actionAccount;

        // Trust Footer
        document.getElementById('trust-footer-text').textContent = t.trust;
      }

      // Check current query param
      const urlParams = new URLSearchParams(window.location.search);
      let activeLang = urlParams.get('lang') || 'tr';
      applyLanguage(activeLang);

      // Handle in-page lang switch clicks smoothly
      document.querySelectorAll('.member-lang-switcher .lang-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          const targetLang = this.dataset.lang;
          const currentUrl = new URL(window.location.href);
          currentUrl.searchParams.set('lang', targetLang);
          window.history.replaceState({}, '', currentUrl.toString());
          applyLanguage(targetLang);
        });
      });
    })();
  </script>
</body>
</html>
