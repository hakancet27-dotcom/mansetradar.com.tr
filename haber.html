  <meta name="robots" content="noindex,follow">

    (function () {
      var target = '/' + window.location.search + window.location.hash;
      window.location.replace(target);
    })();

<body>

      var target = '/' + window.location.search + window.location.hash;

        link.href = target;
        link.textContent = target;
      }
