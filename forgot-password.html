<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şifre Sıfırlama | Manşet Radar</title>
  <meta name="robots" content="noindex,follow">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site-typography.css?v=20261015">
  <link rel="stylesheet" href="/assets/css/member.css?v=20261027">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4WP1H2EJ6F"></script>
  <script>
    window.dataLayer=window.dataLayer||[];
    function gtag(){dataLayer.push(arguments);}
    gtag("js",new Date());
    gtag("config","G-4WP1H2EJ6F");
  </script>
</head>
<body class="member-page">
  <main class="member-shell">
    <section class="member-card">
      
      <!-- Brand Header -->
      <div class="member-header-brand">
        <a class="member-brand-logo" href="/" id="brand-link">
          <span class="member-logo-badge">M</span>
          <span class="member-brand-text">MANŞET<strong>RADAR</strong></span>
        </a>
      </div>

      <!-- Navigation Back Link -->
      <div class="member-card-nav">
        <a class="member-back-home" href="/login.html" id="back-login-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span id="back-login-text">Giriş ekranına dön</span>
        </a>
      </div>

      <h1 id="forgot-title">Şifre Sıfırlama</h1>
      <p class="member-muted" id="forgot-desc">Kayıtlı e-posta adresinizi girin. Size şifre sıfırlama bağlantısını güvenli olarak iletelim.</p>

      <form id="forgot-form" class="member-form">
        <label>
          <span id="label-forgot-email">E-posta Adresi</span>
          <input id="forgot-email" type="email" autocomplete="email" required placeholder="ornek@mail.com">
        </label>
        <button class="member-btn" type="submit" id="submit-forgot-btn">Bağlantı Gönder</button>
      </form>

      <p id="member-message" class="member-message" role="status" aria-live="polite"></p>

      <!-- Bottom Secondary Navigation -->
      <div class="member-card-actions">
        <a class="member-inline-btn" href="/login.html" id="card-action-login">Giriş Yap</a>
        <a class="member-inline-btn" href="/" id="card-action-home">Ana Sayfa</a>
      </div>

      <!-- Corporate Trust Badge -->
      <div class="member-trust-footer">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        <span>256-Bit SSL Güvenliği &middot; Mansetradar Medya Grubu</span>
      </div>

    </section>
  </main>

  <script src="/assets/js/member-auth.js?v=20260530b"></script>
  <script>
    (function(){
      function message(text,isError){
        var node=document.getElementById('member-message');
        if(!node)return;
        node.textContent=text||'';
        node.className='member-message'+(isError?' error':'');
      }
      document.addEventListener('DOMContentLoaded',function(){
        var form=document.getElementById('forgot-form');
        if(!form)return;
        form.addEventListener('submit',async function(event){
          event.preventDefault();
          message('Bağlantı gönderiliyor...');
          try{
            var email=document.getElementById('forgot-email').value;
            var response=await window.HaberMember.resetPassword(email);
            if(response.error)throw response.error;
            message('Sıfırlama bağlantısı gönderildi. Gelen kutunuzu kontrol edin.');
          }catch(error){
            message(error.message||'İşlem tamamlanamadı.',true);
          }
        });
      });

      // Multilingual support for forgot-password
      const params = new URLSearchParams(window.location.search);
      const lang = (params.get('lang') || '').toLowerCase();
      if (lang === 'de') {
        document.documentElement.lang = 'de';
        document.title = "Passwort zurücksetzen | mansetradar.com.tr";
        document.getElementById('forgot-title').textContent = "Passwort zurücksetzen";
        document.getElementById('forgot-desc').textContent = "Geben Sie Ihre registrierte E-Mail-Adresse ein. Wir senden Ihnen einen sicheren Link zum Zurücksetzen.";
        document.getElementById('label-forgot-email').textContent = "E-Mail-Adresse";
        document.getElementById('forgot-email').placeholder = "beispiel@mail.com";
        document.getElementById('submit-forgot-btn').textContent = "Link anfordern";
        document.getElementById('back-login-text').textContent = "Zurück zum Login";
        document.getElementById('card-action-login').textContent = "Anmelden";
        document.getElementById('card-action-home').textContent = "Zur Startseite";
        document.getElementById('card-action-home').href = "/nachrichten/";
        document.getElementById('brand-link').href = "/nachrichten/";
      } else if (lang === 'en') {
        document.documentElement.lang = 'en';
        document.title = "Reset Password | mansetradar.com.tr";
        document.getElementById('forgot-title').textContent = "Reset Password";
        document.getElementById('forgot-desc').textContent = "Enter your registered email address and we'll send you a secure link to reset your password.";
        document.getElementById('label-forgot-email').textContent = "Email Address";
        document.getElementById('forgot-email').placeholder = "name@example.com";
        document.getElementById('submit-forgot-btn').textContent = "Send Reset Link";
        document.getElementById('back-login-text').textContent = "Back to Login";
        document.getElementById('card-action-login').textContent = "Sign In";
        document.getElementById('card-action-home').textContent = "Home";
        document.getElementById('card-action-home').href = "/news/";
        document.getElementById('brand-link').href = "/news/";
      }
    })();
  </script>
</body>
</html>
