<!doctype html>
<html lang="tr">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4WP1H2EJ6F"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-4WP1H2EJ6F");</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Şifre Sıfırlama | Manşet Radar</title>
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="/assets/css/member.css">
</head>
<body class="member-page">
  <main class="member-shell">
    <section class="member-card">
      <a class="member-brand" href="/haber/">Manşet Radar</a>
      <h1>Şifre Sıfırlama</h1>
      <p class="member-muted">Üyelik e-postanızı yazın. Sıfırlama bağlantısını e-posta adresinize gönderelim.</p>
      <form id="forgot-form" class="member-form">
        <label>E-posta<input id="forgot-email" type="email" autocomplete="email" required></label>
        <button class="member-btn" type="submit">Bağlantı Gönder</button>
      </form>
      <p><a class="member-brand" href="/login.html">Giriş ekranına dön</a></p>
      <p id="member-message" class="member-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="/assets/js/member-auth.js?v=20260530b"></script>
  <script>
    (function(){
      function message(text,isError){
        var node=document.getElementById('member-message');
        if(!node)return;
        node.textContent=text||'';
        node.className='member-message'+(isError?' error':'');
      }
      document.addEventListener('DOMContentLoaded',function(){
        var form=document.getElementById('forgot-form');
        if(!form)return;
        form.addEventListener('submit',async function(event){
          event.preventDefault();
          message('Bağlantı gönderiliyor...');
          try{
            var email=document.getElementById('forgot-email').value;
            var response=await window.HaberMember.resetPassword(email);
            if(response.error)throw response.error;
            message('Bağlantı gönderildi. Gelen kutunuzu kontrol edin.');
          }catch(error){
            message(error.message||'İşlem tamamlanamadı.',true);
          }
        });
      });
    })();
  </script>
</body>
</html>
